      background: linear-gradient(145deg, #df9a62 0%, #b85f43 100%);

        inset 0 3px 0 rgba(255,255,255,0.18),
        6px 7px 9px rgba(60, 35, 23, 0.15);
    }

    .chair::before {
      content: "";
      position: absolute;
      right: 5px;
      bottom: -24px;
      left: 5px;
      height: 31px;
      border-right: 4px solid #704432;
      border-left: 4px solid #704432;
    }

    .chair-left {
      left: 7px;
      transform: rotateY(-13deg) scale(0.9);
    }

    .chair-right {
      right: 7px;
      transform: rotateY(13deg) scale(0.9);
    }

    .table-number {
      position: absolute;
      top: 38px;
      left: 50%;
      z-index: 9;
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border: 1px solid rgba(122, 72, 43, 0.22);
      border-radius: 50%;
      color: #8d563a;
      background: #fff4df;
      transform: translateX(-50%);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 3px 6px rgba(72, 43, 27, 0.12);
    }

    .return-spot {
      --w: 132px;
      --h: 156px;
      --depth: 62px;
      --z: 16;
      top: 55%;
      left: 88%;
    }

    .return-box {
      position: absolute;
      top: 14px;
      left: 10px;
      width: 110px;
      height: 121px;
      border: 2px solid #986443;
      border-radius: 18px 18px 13px 13px;
      background: linear-gradient(145deg, #f5d595 0%, #e3a65f 74%, #c48148 100%);
      box-shadow:
        10px 10px 0 #bd7846,
        15px 18px 21px rgba(70, 43, 25, 0.2),
        inset 4px 3px 0 rgba(255,255,255,0.24);
    }

    .return-box::before {
      content: "";
      position: absolute;
      top: 49px;
      right: 17px;
      left: 17px;
      height: 12px;
      border: 4px solid #6b402e;
      border-radius: 999px;
      background: #402a22;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.35);
    }

    .return-box::after {
      content: "RETURN";
      position: absolute;
      top: 17px;
      left: 50%;
      color: #704229;
      transform: translateX(-50%);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .return-copy {
      position: absolute;
      bottom: 16px;
      left: 50%;
      width: 74px;
      padding: 7px 4px;
      border: 1px solid rgba(116, 66, 39, 0.26);
      border-radius: 8px;
      color: #764a30;
      background: rgba(255, 240, 201, 0.58);
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 900;
      text-align: center;
    }

    .board-spot {
      --w: 174px;
      --h: 115px;
      --depth: 12px;
      --z: 10;
      top: 38%;
      left: 43%;
    }

    .score-board {
      position: absolute;
      inset: 6px;
      border: 8px solid #8c603f;
      border-radius: 9px;
      color: #f6efd4;
      background:
        radial-gradient(circle at 12% 17%, rgba(255,255,255,0.05) 0 2px, transparent 3px),
        linear-gradient(145deg, #385b50 0%, #25463e 100%);
      box-shadow:
        0 12px 18px rgba(62, 40, 27, 0.19),
        inset 0 0 18px rgba(0,0,0,0.16);
      text-align: center;
    }

    .score-board span {
      display: block;
      margin-top: 13px;
      color: rgba(255, 242, 205, 0.68);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 8px;
      font-style: italic;
      letter-spacing: 0.18em;
    }

    .score-board strong {
      display: block;
      margin-top: 1px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1;
    }

    .score-board small {
      display: block;
      margin-top: 4px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .calendar-card {
      position: absolute;
      top: 18px;
      right: -43px;
      z-index: 3;
      width: 49px;
      height: 59px;
      overflow: hidden;
      border: 1px solid #d6c9b9;
      border-radius: 6px;
      color: #6c5a4c;
      background: #fffaf0;
      box-shadow:
        0 8px 12px rgba(67, 42, 27, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.86);
      transform: rotate(3deg);
      text-align: center;
    }

    .calendar-card::before,
    .calendar-card::after {
      content: "";
      position: absolute;
      top: 4px;
      width: 4px;
      height: 9px;
      border-radius: 4px;
      background: #8d755f;
    }

    .calendar-card::before {
      left: 11px;
    }

    .calendar-card::after {
      right: 11px;
    }

    .calendar-month {
      display: block;
      padding: 7px 2px 4px;
      color: #fff8ea;
      background: #d77c4b;
      font-size: 7px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .calendar-day {
      display: block;
      padding-top: 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .host-spot {
      --w: 150px;
      --h: 178px;
      --depth: -8px;
      --z: 5;
      top: 38%;
      left: 24%;
    }

    .host-image {
      position: absolute;
      right: 4px;
      bottom: 0;
      width: 142px;
      height: 142px;
      object-fit: contain;
      filter:
        drop-shadow(0 13px 9px rgba(70, 42, 25, 0.18))
        saturate(0.88);
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .host-spot .object-label {
      top: 0;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%) translateZ(24px);
    }

    .host-spot:hover .object-label,
    .host-spot.is-active .object-label {
      transform: translateX(-50%) translateY(-2px) translateZ(24px);
    }

    .detail-card {
      position: absolute;
      right: 24px;
      bottom: 24px;
      z-index: 90;
      width: min(320px, calc(100% - 48px));
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.62);
      border-radius: 19px;
      background: rgba(255, 250, 242, 0.9);
      box-shadow:
        0 22px 54px rgba(60, 38, 24, 0.25),
        inset 0 1px 0 rgba(255,255,255,0.9);
      backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px) scale(0.98);
      transition:
        opacity 260ms ease,
        transform 420ms cubic-bezier(0.22, 0.8, 0.24, 1);
    }

    .detail-card.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .detail-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 29px;
      height: 29px;
      padding: 0;
      border: 1px solid #dfd3c6;
      border-radius: 9px;
      color: #76695d;
      background: rgba(255,255,255,0.68);
      cursor: pointer;
    }

    .detail-eyebrow {
      color: #b26640;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .detail-title {
      margin: 7px 35px 7px 0;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.045em;
    }

    .detail-copy {
      margin: 0;
      color: #74685e;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.65;
      word-break: keep-all;
    }

    .detail-action {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      color: #fffaf4;
      background: linear-gradient(135deg, #de7d4a 0%, #c96438 100%);
      box-shadow: 0 8px 18px rgba(181, 86, 42, 0.22);
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .detail-action:hover {
      transform: translateY(-1px);
      box-shadow: 0 11px 22px rgba(181, 86, 42, 0.27);
    }

    .detail-action span:last-child {
      font-size: 16px;
    }

    .scene-hint {
      position: absolute;
      bottom: 21px;
      left: 24px;
      z-index: 80;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,0.48);
      border-radius: 999px;
      color: rgba(76, 62, 51, 0.78);
      background: rgba(255, 250, 242, 0.64);
      backdrop-filter: blur(10px);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.03em;
      pointer-events: none;
      transition: opacity 360ms ease, transform 360ms ease;
    }

    .scene-hint.is-hidden {
      opacity: 0;
      transform: translateY(7px);
    }

    .hint-orbit {
      position: relative;
      width: 16px;
      height: 10px;
      border: 1px solid #aa7557;
      border-radius: 50%;
    }

    .hint-orbit::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d27a4d;
      transform: translate(-50%, -50%);
    }

    .reset-view {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 80;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 11px;
      border: 1px solid rgba(255,255,255,0.56);
      border-radius: 11px;
      color: #6d6055;
      background: rgba(255,250,243,0.72);
      box-shadow: 0 6px 15px rgba(68, 43, 27, 0.1);
      backdrop-filter: blur(10px);
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .reset-view::before {
      content: "↺";
      font-size: 15px;
      line-height: 1;
    }

    .receipt-hud {
      position: absolute;
      right: 60px;
      bottom: 30px;
      z-index: 84;
      width: 52px;
      height: 52px;
      padding: 8px;
      border: 2px solid rgba(255, 255, 255, 0.96);
      border-radius: 15px;
      background: #fff;
      box-shadow:
        0 7px 0 rgba(74, 58, 49, 0.17),
        0 11px 18px rgba(69, 43, 27, 0.18),
        inset 0 2px 0 rgba(255, 255, 255, 0.9);
      cursor: pointer;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .receipt-hud:hover {
      transform: translateY(-2px) scale(1.04);
      filter: brightness(1.04);
    }

    .receipt-hud:active {
      transform: translateY(2px) scale(0.97);
      box-shadow:
        0 4px 0 rgba(105, 62, 37, 0.22),
        0 7px 12px rgba(69, 43, 27, 0.18),
        inset 0 2px 0 rgba(255, 255, 255, 0.72);
    }

    .receipt-hud img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
      pointer-events: none;
    }

    .receipt-count {
      position: absolute;
      top: -7px;
      right: -7px;
      display: grid;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      place-items: center;
      border: 2px solid #fff8e9;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(180deg, #f28a55 0%, #c8522e 100%);
      box-shadow: 0 3px 7px rgba(93, 45, 25, 0.28);
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
    }

    .pan-right-hint {
      position: absolute;
      top: 50%;
      right: 5px;
      z-index: 82;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 40px;
      height: 54px;
      pointer-events: none;
      transform: translateY(-50%);
      opacity: 1;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .pan-right-hint span {
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 12px solid #fff;
      opacity: 0.16;
      filter: drop-shadow(0 2px 2px rgba(69, 43, 27, 0.28));
      animation: pan-arrow-light-sweep 1.7s ease-in-out 2 both;
    }

    .pan-right-hint span:nth-child(1) {
      animation-delay: 0s;
    }

    .pan-right-hint span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .pan-right-hint.is-hidden {
      opacity: 0;
      transform: translate(7px, -50%);
    }

    @keyframes pan-arrow-light-sweep {
      0%, 4% {
        opacity: 0.16;
        filter: drop-shadow(0 2px 2px rgba(69, 43, 27, 0.28));
      }
      12% {
        opacity: 0.62;
        filter:
          drop-shadow(0 0 3px rgba(255, 255, 255, 0.5))
          drop-shadow(0 2px 2px rgba(69, 43, 27, 0.24));
      }
      20%, 100% {
        opacity: 0.16;
        filter: drop-shadow(0 2px 2px rgba(69, 43, 27, 0.28));
      }
    }

    #popup {
      z-index: 1000;
    }

    #popup-container {
      position: relative;
      z-index: 1000;
    }

    @media (max-width: 820px) {
      .room-app {
        padding: 10px;
      }

      .topbar {
        top: 10px;
        right: 12px;
        left: 12px;
        height: 52px;
      }

      .brand-subtitle,
      .room-title span,
      .live-dot {
        display: none;
      }

      .room-viewport {
        inset: 72px 10px 10px;
        border-radius: 20px;
      }

      .scene {
        min-width: 760px;
        left: 50%;
        right: auto;
        width: 760px;
        transform:
          translate3d(calc(-50% + var(--camera-x)), var(--camera-y), 0)
          scale(var(--camera-scale))
          rotateX(var(--look-y))
          rotateY(var(--look-x));
      }

      .user-pill {
        max-width: 98px;
      }
    }

    @media (max-height: 620px) {
      .topbar {
        height: 48px;
      }

      .room-viewport {
        inset: 76px 18px 14px;
      }

      .object-label {
        bottom: -16px;
      }

      .scene-hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }

      .scene {
        --look-x: 0deg !important;
        --look-y: 0deg !important;
      }

      .pan-right-hint span {
        animation-duration: 1.7s !important;
        animation-iteration-count: 2 !important;
      }
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .main-page {
      width: min(375px, 100vw);
      height: min(667px, 100dvh);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.52);
      border-radius: 22px;
      background: #d9c5ad;
      box-shadow:
        0 28px 70px rgba(58, 37, 23, 0.3),
        0 3px 12px rgba(58, 37, 23, 0.16);
    }

    .room-app {
      padding: 0;
    }

    .topbar {
      top: 9px;
      right: 9px;
      left: 9px;
      height: 51px;
      grid-template-columns: 1fr auto 1fr;
      padding: 0 9px;
      border-radius: 14px;
    }

    .brand {
      gap: 7px;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      border-radius: 9px;
      font-size: 10px;
    }

    .brand-title {
      font-size: 12px;
    }

    .brand-subtitle,
    .room-title span,
    .live-dot {
      display: none;
    }

    .room-title strong {
      font-size: 13px;
    }

    .user-pill {
      max-width: 76px;
      padding: 7px 8px;
      font-size: 9px;
    }

    .room-viewport {
      inset: 69px 9px 9px;
      border-radius: 18px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .room-viewport.is-dragging {
      cursor: grabbing;
    }

    .room-viewport.is-dragging .scene {
      transition: none;
    }

    .scene.kiosk-rush {
      transition: none;
    }

    .scene {
      --drag-x: 0px;
      --drag-y: 0px;
      top: 50%;
      right: auto;
      bottom: auto;
      left: 50%;
      width: 760px;
      min-width: 760px;
      height: 720px;
      transform:
        translate3d(
          calc(-50% + var(--camera-x) + var(--drag-x)),
          calc(-50% + var(--camera-y) + var(--drag-y)),
          0
        )
        scale(var(--camera-scale))
        rotateX(var(--look-y))
        rotateY(var(--look-x));
      transform-origin: 50% 54%;
    }

    .reset-view {
      top: 11px;
      right: 11px;
      padding: 8px 9px;
      font-size: 9px;
    }

    .scene-hint {
      bottom: 11px;
      left: 11px;
      max-width: 245px;
      padding: 7px 9px;
      font-size: 8px;
    }

    .detail-card {
      right: 11px;
      bottom: 11px;
      width: calc(100% - 22px);
      padding: 18px;
      border-radius: 16px;
    }

    .detail-title {
      font-size: 19px;
    }

    .detail-copy {
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="main-page">
    <div id="popup-container"></div>

    <div class="room-app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">LT</div>
          <div class="brand-copy">
            <div class="brand-title">LTRYI</div>
            <div class="brand-subtitle">English Study Cafe</div>
          </div>
        </div>

        <div class="room-title">
          <strong>카페 라운지</strong>
          <span>pick a seat, begin a study</span>
        </div>

        <div class="user-area">
          <span class="live-dot" aria-hidden="true"></span>
          <div class="user-pill" id="userPill">guest</div>
        </div>
      </header>

      <main class="room-viewport" id="roomViewport">
        <div class="scene" id="scene">
          <div class="wall" aria-hidden="true">
            <div class="window window-left"></div>
            <div class="window window-right"></div>
            <div class="wall-logo">
              <strong>LTRYI</strong>
              <span>study cafe</span>
            </div>
            <div class="shelf"></div>
          </div>

          <div class="floor" aria-hidden="true"></div>
          <div class="rug" aria-hidden="true"></div>
          <div class="welcome-mat" aria-hidden="true">WELCOME</div>
          <div class="counter" aria-hidden="true"></div>
          <div class="lamp lamp-one" aria-hidden="true"></div>
          <div class="lamp lamp-two" aria-hidden="true"></div>

          <button
            class="scene-object kiosk-spot"
            id="kiosk"
            type="button"
            data-spot="kiosk"
            aria-label="키오스크에서 메뉴 주문하기"
          >
            <span class="object-visual">
              <span class="object-shadow"></span>
              <span class="kiosk-machine"></span>
              <span class="kiosk-screen-copy">
                <strong>메뉴<br />주문</strong>
                <span>touch</span>
              </span>
              <span class="object-label">키오스크</span>
            </span>
          </button>

          <button
            class="scene-object table-cluster"
            type="button"
            data-spot="table"
            aria-label="학습 테이블로 이동"
          >
            <span class="object-visual">
              <span class="table-piece table-one">
                <span class="object-shadow"></span>
                <span class="chair chair-left"></span>
                <span class="chair chair-right"></span>
                <span class="table-stem"></span>
                <span class="table-top"></span>
              </span>
              <span class="table-piece table-two">
                <span class="object-shadow"></span>
                <span class="chair chair-left"></span>
                <span class="chair chair-right"></span>
                <span class="table-stem"></span>
                <span class="table-top"></span>
              </span>
              <span class="table-piece table-three">
                <span class="object-shadow"></span>
                <span class="chair chair-left"></span>
                <span class="chair chair-right"></span>
                <span class="table-stem"></span>
                <span class="table-top"></span>
              </span>
              <span class="table-hit-zone table-hit-one" aria-hidden="true"></span>
              <span class="table-hit-zone table-hit-two" aria-hidden="true"></span>
              <span class="table-hit-zone table-hit-three" aria-hidden="true"></span>
              <span class="object-label">학습 테이블</span>
            </span>
          </button>

          <button
            class="scene-object return-spot"
            type="button"
            data-spot="return"
            aria-label="숙제 반납함 열기"
          >
            <span class="object-visual">
              <span class="object-shadow"></span>
              <span class="return-box">
                <span class="return-copy">숙제 제출</span>
              </span>
              <span class="object-label">반납함</span>
            </span>
          </button>

          <button
            class="scene-object board-spot"
            type="button"
            data-spot="board"
            aria-label="학습 기록 보기"
          >
            <span class="object-visual">
              <span class="score-board">
                <span>TODAY</span>
                <strong id="todayPoint25d">0</strong>
                <small>STUDY LOG</small>
              </span>
              <span class="calendar-card" aria-hidden="true">
                <span class="calendar-month" id="calendarMonth25d">JUL</span>
                <span class="calendar-day" id="calendarDay25d">30</span>
              </span>
              <span class="object-label">학습 기록</span>
            </span>
          </button>

          <button
            class="scene-object host-spot"
            type="button"
            data-spot="host"
            aria-label="카페지기 분석 리포트 보기"
          >
            <span class="object-visual">
              <span class="object-shadow"></span>
              <img class="host-image" src="cafe_jigi.png" alt="" />
              <span class="object-label">카페지기</span>
            </span>
          </button>
        </div>

        <div class="sun-wash" aria-hidden="true"></div>

        <button class="reset-view" id="resetView" type="button">처음 위치</button>

        <button class="receipt-hud" id="receipt_icon" type="button" aria-label="주문 영수증 보기">
          <img src="receipt_icon_128.png" alt="" />
          <span class="receipt-count" id="receiptCount25d">0</span>
        </button>

        <div class="scene-hint" id="sceneHint">
          <span class="hint-orbit" aria-hidden="true"></span>
          드래그해서 카페를 둘러보고, 오브젝트를 눌러보세요
        </div>

        <div class="pan-right-hint" id="panRightHint" aria-hidden="true">
          <span></span><span></span>
        </div>

        <aside class="detail-card" id="detailCard" aria-live="polite">
          <button class="detail-close" id="detailClose" type="button" aria-label="닫기">×</button>
          <div class="detail-eyebrow" id="detailEyebrow">TABLE</div>
          <h2 class="detail-title" id="detailTitle">테이블</h2>
          <p class="detail-copy" id="detailCopy"></p>
          <a class="detail-action" id="detailAction" href="#">
            <span id="detailActionLabel">이동하기</span>
            <span aria-hidden="true">→</span>
          </a>
        </aside>
      </main>
    </div>
  </div>

  <script src="day_manager.js?v=salmon2-route-20260520"></script>
  <script src="kiosk_mainpopup.js"></script>
  <script src="kiosk_subpopup.js?v=salmon2-route-20260520"></script>
  <script src="kiosk_receipt.js?v=salmon2-route-20260520"></script>
  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const userId = params.get("id") || "guest";
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const room = document.getElementById("roomViewport");
      const scene = document.getElementById("scene");
      const userPill = document.getElementById("userPill");
      const detailCard = document.getElementById("detailCard");
      const detailEyebrow = document.getElementById("detailEyebrow");
      const detailTitle = document.getElementById("detailTitle");
      const detailCopy = document.getElementById("detailCopy");
      const detailAction = document.getElementById("detailAction");
      const detailActionLabel = document.getElementById("detailActionLabel");
      const detailClose = document.getElementById("detailClose");
      const resetView = document.getElementById("resetView");
      const receiptHud = document.getElementById("receipt_icon");
      const receiptCount = document.getElementById("receiptCount25d");
      const sceneHint = document.getElementById("sceneHint");
      const panRightHint = document.getElementById("panRightHint");
      const kioskButton = document.getElementById("kiosk");
      const tableCluster = document.querySelector('[data-spot="table"]');
      const tableHitZones = [...document.querySelectorAll(".table-hit-zone")];
      const calendarMonth = document.getElementById("calendarMonth25d");
      const calendarDay = document.getElementById("calendarDay25d");
      const spots = [...document.querySelectorAll("[data-spot]")];
      let dragX = 0;
      let dragY = 0;
      let isDragging = false;
      let movedWhileDragging = false;
      let suppressNextClick = false;
      let dragPointerId = null;
      let pointerStartX = 0;
      let pointerStartY = 0;
      let dragStartX = 0;
      let dragStartY = 0;
      let kioskCinematicRunning = false;
      let allowKioskPopup = false;
      let kioskRushAnimation = null;
      const initialDragX = 163;
      const kioskApproachCamera = ["39%", "7%", "1.58"];
      const kioskCloseCamera = ["55%", "15%", "2.25"];

      const withUserId = (path) => {
        const joiner = path.includes("?") ? "&" : "?";
        return `${path}${joiner}id=${encodeURIComponent(userId)}`;
      };

      const spotDetails = {
        table: {
          eyebrow: "STUDY TABLE",
          title: "학습 테이블",
          copy: "주문한 접시를 펼치거나 태블릿을 켜고 오늘의 학습을 시작합니다.",
          action: "테이블 열기",
          route: "homework-tray_v1-25d.html",
          camera: ["5%", "-6%", "1.1"]
        },
        return: {
          eyebrow: "RETURN",
          title: "숙제 반납함",
          copy: "완료한 숙제와 제출물을 정리해 카페지기에게 돌려보냅니다.",
          action: "제출 화면 열기",
          route: "homework-submit-25d.html",
          camera: ["-11%", "0%", "1.1"]
        },
        board: {
          eyebrow: "STUDY LOG",
          title: "나의 학습 기록",
          copy: "달력에서 공부한 날과 쌓아온 기록을 차분하게 확인합니다.",
          action: "학습 기록 보기",
          route: "grades-calendar-25d.html",
          camera: ["-1%", "8%", "1.1"]
        },
        host: {
          eyebrow: "CAFE GUIDE",
          title: "카페지기",
          copy: "지금까지의 학습 흐름을 살펴보고 다음에 무엇을 공부할지 안내받습니다.",
          action: "분석 리포트 보기",
          route: "report-analysis-25d.html",
          camera: ["-8%", "7%", "1.09"]
        }
      };

      userPill.textContent = userId;

      const updateReceiptHud = () => {
        const entries = JSON.parse(localStorage.getItem("HWPlus") || "[]");
        receiptCount.textContent = String(entries.length);
        receiptHud.classList.toggle("is-empty", entries.length === 0);
      };

      updateReceiptHud();
      receiptHud.addEventListener("click", () => {
        window.showReceiptFromHWPlus?.();
        updateReceiptHud();
      });

      const setCamera = (camera = ["0%", "0%", "1"]) => {
        scene.style.setProperty("--camera-x", camera[0]);
        scene.style.setProperty("--camera-y", camera[1]);
        scene.style.setProperty("--camera-scale", camera[2]);
      };

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const getPanBounds = () => ({
        x: Math.max(0, (scene.offsetWidth - room.clientWidth) / 2 - 12),
        y: Math.max(0, (scene.offsetHeight - room.clientHeight) / 2 - 12)
      });

      const setDrag = (nextX, nextY) => {
        const bounds = getPanBounds();
        dragX = clamp(nextX, -bounds.x, bounds.x);
        dragY = clamp(nextY, -bounds.y, bounds.y);
        scene.style.setProperty("--drag-x", `${dragX}px`);
        scene.style.setProperty("--drag-y", `${dragY}px`);
        panRightHint.classList.toggle("is-hidden", dragX < initialDragX - 26);
      };

      const clearActiveSpot = () => {
        spots.forEach((spot) => spot.classList.remove("is-active"));
      };

      const closeDetail = () => {
        detailCard.classList.remove("is-open");
        clearActiveSpot();
        setCamera();
      };

      const resetRoom = () => {
        closeDetail();
        setDrag(initialDragX, 0);
      };

      const openDetail = (spot, detail) => {
        clearActiveSpot();
        spot.classList.add("is-active");
        setCamera(detail.camera);

        detailEyebrow.textContent = detail.eyebrow;
        detailTitle.textContent = detail.title;
        detailCopy.textContent = detail.copy;
        detailActionLabel.textContent = detail.action;
        detailAction.href = withUserId(detail.route);
        detailCard.classList.add("is-open");
      };

      spots.forEach((spot) => {
        spot.addEventListener("click", () => {
          const key = spot.dataset.spot;

          if (key === "kiosk") {
            clearActiveSpot();
            spot.classList.add("is-active");
            detailCard.classList.remove("is-open");
            setCamera(kioskCloseCamera);
            return;
          }

          const detail = spotDetails[key];
          if (detail) openDetail(spot, detail);
        });
      });

      tableHitZones.forEach((hitZone) => {
        hitZone.addEventListener("click", (event) => {
          event.stopPropagation();
          tableCluster.focus({ preventScroll: true });
          tableCluster.click();
        });
      });

      kioskButton.addEventListener("click", (event) => {
        if (allowKioskPopup) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        if (kioskCinematicRunning) return;

        kioskCinematicRunning = true;
        clearActiveSpot();
        kioskButton.classList.add("is-active");
        detailCard.classList.remove("is-open");
        sceneHint.classList.add("is-hidden");
        panRightHint.classList.add("is-hidden");
        const fromTransform = getComputedStyle(scene).transform;
        scene.classList.add("kiosk-rush");
        setCamera(kioskApproachCamera);
        const approachTransform = getComputedStyle(scene).transform;
        setCamera(kioskCloseCamera);
        const closeTransform = getComputedStyle(scene).transform;

        const openKioskPopup = () => {
          if (!kioskCinematicRunning) return;
          kioskRushAnimation?.cancel();
          kioskRushAnimation = null;
          allowKioskPopup = true;
          kioskButton.click();
          allowKioskPopup = false;
          kioskCinematicRunning = false;
          scene.classList.remove("kiosk-rush");
        };

        if (typeof scene.animate !== "function") {
          setTimeout(openKioskPopup, reducedMotion ? 70 : 300);
          return;
        }

        kioskRushAnimation = scene.animate([
          {
            transform: fromTransform,
            offset: 0,
            easing: "cubic-bezier(0.24, 0.7, 0.26, 1)"
          },
          {
            transform: approachTransform,
            offset: 0.38,
            easing: "cubic-bezier(0.12, 0.76, 0.16, 1)"
          },
          {
            transform: closeTransform,
            offset: 1
          }
        ], {
          duration: reducedMotion ? 120 : 480,
          fill: "both"
        });

        kioskRushAnimation.finished
          .then(openKioskPopup)
          .catch(() => {});
      }, true);

      detailClose.addEventListener("click", closeDetail);
      resetView.addEventListener("click", resetRoom);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDetail();
      });

      room.addEventListener("pointerdown", (event) => {
          if (event.button !== undefined && event.button !== 0) return;
          if (event.target.closest(".detail-card, .reset-view, #popup")) return;

          suppressNextClick = false;
          isDragging = true;
          movedWhileDragging = false;
          dragPointerId = event.pointerId;
          pointerStartX = event.clientX;
          pointerStartY = event.clientY;
          dragStartX = dragX;
          dragStartY = dragY;
          room.classList.add("is-dragging");
        });

      room.addEventListener("pointermove", (event) => {
          if (isDragging && event.pointerId === dragPointerId) {
            const deltaX = event.clientX - pointerStartX;
            const deltaY = event.clientY - pointerStartY;
            if (Math.hypot(deltaX, deltaY) > 6 && !movedWhileDragging) {
              movedWhileDragging = true;
              room.setPointerCapture?.(event.pointerId);
              sceneHint.classList.add("is-hidden");
            }
            setDrag(dragStartX + deltaX, dragStartY + deltaY);
            scene.style.setProperty("--look-x", `${clamp(deltaX / 90, -1.7, 1.7)}deg`);
            scene.style.setProperty("--look-y", `${clamp(deltaY / -130, -1, 1)}deg`);
            event.preventDefault();
            return;
          }

          scene.style.setProperty("--look-x", "0deg");
          scene.style.setProperty("--look-y", "0deg");
        });

      const finishDrag = (event) => {
          if (!isDragging || event.pointerId !== dragPointerId) return;
          suppressNextClick = movedWhileDragging;
          isDragging = false;
          dragPointerId = null;
          room.classList.remove("is-dragging");
          scene.style.setProperty("--look-x", "0deg");
          scene.style.setProperty("--look-y", "0deg");
          if (room.hasPointerCapture?.(event.pointerId)) {
            room.releasePointerCapture(event.pointerId);
          }
          if (suppressNextClick) {
            setTimeout(() => {
              suppressNextClick = false;
            }, 0);
          }
        };

      room.addEventListener("pointerup", finishDrag);
      room.addEventListener("pointercancel", finishDrag);

      room.addEventListener("click", (event) => {
          if (!suppressNextClick) return;
          suppressNextClick = false;
          event.preventDefault();
          event.stopPropagation();
      }, true);

      room.addEventListener("pointerleave", () => {
          if (isDragging) return;
          scene.style.setProperty("--look-x", "0deg");
          scene.style.setProperty("--look-y", "0deg");
      });

      requestAnimationFrame(() => setDrag(initialDragX, 0));

      const today = new Date();
      calendarMonth.textContent = today
        .toLocaleString("en-US", { month: "short" })
        .toUpperCase();
      calendarDay.textContent = String(today.getDate());
      setTimeout(() => sceneHint.classList.add("is-hidden"), 5000);

      window.addEventListener("DOMContentLoaded", () => {
        const popup = document.getElementById("popup");
        if (!popup) return;

        const popupObserver = new MutationObserver(() => {
          if (popup.style.display === "none") {
            document.querySelector('[data-spot="kiosk"]')?.classList.remove("is-active");
            kioskRushAnimation?.cancel();
            kioskRushAnimation = null;
            kioskCinematicRunning = false;
            scene.classList.remove("kiosk-rush");
            setCamera();
            updateReceiptHud();
          }
        });

        popupObserver.observe(popup, {
          attributes: true,
          attributeFilter: ["style"]
        });
      });
    })();
  </script>
</body>
</html>
