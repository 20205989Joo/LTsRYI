  .print-set { margin-top: 22px; display: none; }

  .print-page {

    padding: 26px;

</style>

let current = 0;
let currentOptions = [];
let selected = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr, n) { return shuffle(arr).slice(0, n); }
function makeOptions(item) {
  const right = pick(item.correct, 1).map(text => ({text, correct: true}));
  const wrong = pick(item.wrong, 4).map(text => ({text, correct: false}));
  return shuffle([...right, ...wrong]);
}
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = DATA.map((it, idx) => `<button class="${idx===current?'active':''}" onclick="go(${idx})"><b>${it.title}</b><br><span>${it.subtitle}</span></button>`).join('');
}
function render() {
  const item = DATA[current];
  selected = null;
  currentOptions = makeOptions(item);
  document.getElementById('eyebrow').textContent = item.id;
  document.getElementById('title').textContent = item.title;
  document.getElementById('summary').textContent = item.subtitle;
  document.getElementById('passage').textContent = item.passage;
  const letters = ['A','B','C','D','E'];
  document.getElementById('options').innerHTML = currentOptions.map((op, idx) => `
    <button class="option" onclick="selectOption(${idx})" id="op${idx}">
      <span class="mark">${letters[idx]}</span><span>${op.text}</span>
    </button>
  `).join('');
  const result = document.getElementById('result');
  result.className = 'result';
  result.innerHTML = '';
  renderNav();
}
function selectOption(idx) {
  selected = idx;
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
    el.classList.remove('correct', 'wrong');
  });
  document.getElementById('result').className = 'result';
}
function checkAnswer() {
  if (selected === null) {
    alert('선지를 하나 골라라.');
    return;
  }
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.remove('selected');
    if (currentOptions[i].correct) el.classList.add('correct');
    else if (i === selected) el.classList.add('wrong');
  });
  const item = DATA[current];
  const ok = currentOptions[selected].correct;
  const result = document.getElementById('result');
  result.className = 'result show';
  result.innerHTML = `
    <div><strong>${ok ? '정답.' : '오답.'}</strong> 한줄요약: ${item.subtitle}</div>
    <ol class="answer-list">${item.correct.map(x => `<li>${x}</li>`).join('')}</ol>
  `;
}
function go(idx) { current = idx; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function rerollCurrent() { render(); }
function nextItem() { current = (current + 1) % DATA.length; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function prevItem() { current = (current - 1 + DATA.length) % DATA.length; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function randomItem() { current = Math.floor(Math.random() * DATA.length); render(); window.scrollTo({top:0, behavior:'smooth'}); }
function makePrintSet() {
  const letters = ['A','B','C','D','E'];
  const set = document.getElementById('printSet');
  const pages = DATA.map((item, pidx) => {
    const ops = makeOptions(item);
    const answerIndex = ops.findIndex(o => o.correct);
    return `<article class="print-page">
      <h3>${item.title}</h3>
      <div class="kr-summary">${item.subtitle}</div>
      <div class="print-passage">${item.passage}</div>
      <div class="q-title">${pidx+1}. 이 글의 요지로 가장 적절한 것은?</div>
      <div class="print-options">
        ${ops.map((op, i) => `<div>${letters[i]}. ${op.text}</div>`).join('')}
      </div>
      <div class="print-answer">정답: ${letters[answerIndex]} / ${item.correct.join(' | ')}</div>
    </article>`;
  }).join('');
  set.innerHTML = pages;
  set.classList.add('show');
  set.scrollIntoView({behavior:'smooth'});
}
render();
