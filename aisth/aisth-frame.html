<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aisth Frame</title>

  <link rel="stylesheet" href="styles-frame.css" />
  <link rel="stylesheet" href="styles-room.css" />
  <link rel="stylesheet" href="styles-Aisth.css" />
</head>

<body>
  <div class="main-page" data-aisth-page>
    <main id="cafe_int" data-aisth-stage>
      <section id="quiz-area" data-aisth-quiz-area aria-live="polite"></section>
    </main>

    <div class="aisth-frame-jump" data-aisth-frame-jump>
      <label class="aisth-frame-jump-label" for="aisth-frame-lesson-select">Jump</label>
      <select id="aisth-frame-lesson-select" class="aisth-frame-lesson-select" aria-label="Aisth lesson jump"></select>
    </div>

    <button id="back-btn" type="button" data-aisth-action="back">돌아가기</button>
  </div>
  <aside class="aisth-palette-panel" aria-label="Aisth color test strip">
    <div class="aisth-palette-title">색 시향지</div>
    <div class="aisth-palette-note">SVTD / grammar</div>
    <div class="aisth-palette-section-label">품사 후보</div>

    <div class="aisth-palette-row is-candidate">
      <span class="aisth-palette-chip is-adj-candidate">adj</span>
      <span class="aisth-palette-label">
        <span class="aisth-palette-label-main">형용사 후보</span>
        <span class="aisth-palette-label-sub">명사에 붙는 속성 스티커</span>
      </span>
    </div>

    <div class="aisth-palette-row is-candidate">
      <span class="aisth-palette-chip is-adv-candidate">adv</span>
      <span class="aisth-palette-label">
        <span class="aisth-palette-label-main">부사 후보</span>
        <span class="aisth-palette-label-sub">동작 옆을 흐르는 방식/시간</span>
      </span>
    </div>

    <div class="aisth-palette-section-label">현재 팔레트</div>
    <div class="aisth-palette-row" style="--chip-bg:#e2f7e8; --chip-border:#2f8f55; --chip-text:#17643c; --chip-glow:rgba(47,143,85,.20);">
      <span class="aisth-palette-chip">S</span>
      <span class="aisth-palette-label">주어</span>
    </div>

    <div class="aisth-palette-row" style="--chip-bg:#fff4cc; --chip-border:#c88a12; --chip-text:#7a4a00; --chip-glow:rgba(216,162,27,.28);">
      <span class="aisth-palette-chip">V</span>
      <span class="aisth-palette-label">동사</span>
    </div>

    <div class="aisth-palette-row" style="--chip-bg:#ffe1e1; --chip-border:#dc3f3f; --chip-text:#a91f1f; --chip-glow:rgba(220,63,63,.20);">
      <span class="aisth-palette-chip">T</span>
      <span class="aisth-palette-label">타겟</span>
    </div>

    <div class="aisth-palette-row" style="--chip-bg:#1f1f1f; --chip-border:#111; --chip-text:#fff; --chip-glow:rgba(0,0,0,.20);">
      <span class="aisth-palette-chip">D</span>
      <span class="aisth-palette-label">디테일</span>
    </div>

    <div class="aisth-palette-row" style="--chip-bg:rgba(136,84,208,.16); --chip-border:#6c3ac7; --chip-text:#6c3ac7; --chip-glow:rgba(136,84,208,.24);">
      <span class="aisth-palette-chip">s</span>
      <span class="aisth-palette-label">s/es</span>
    </div>

    <div class="aisth-palette-row">
      <span class="aisth-palette-chip is-rainbow">ate</span>
      <span class="aisth-palette-label">불규칙</span>
    </div>

    <div class="aisth-palette-row">
      <span class="aisth-palette-chip is-pp">pp</span>
      <span class="aisth-palette-label">pp</span>
    </div>

    <div class="aisth-palette-row is-font-only">
      <span class="aisth-palette-font" style="--font-color:#c7001f;">ing</span>
      <span class="aisth-palette-label">ing</span>
    </div>

    <div class="aisth-palette-row is-font-only">
      <span class="aisth-palette-font" style="--font-color:#075fc9;">ed</span>
      <span class="aisth-palette-label">분사 ed</span>
    </div>

    <div class="aisth-palette-row is-font-only">
      <span class="aisth-palette-font" style="--font-color:#00b0f0;">는</span>
      <span class="aisth-palette-label">조사</span>
    </div>

    <div class="aisth-palette-row is-font-only">
      <span class="aisth-palette-font" style="--font-color:#2f7b3a;">in</span>
      <span class="aisth-palette-label">전치사</span>
    </div>

    <div class="aisth-palette-row is-font-only">
      <span class="aisth-palette-font" style="--font-color:#f17b2a;">will</span>
      <span class="aisth-palette-label">조동사</span>
    </div>

    <div class="aisth-palette-row is-font-only">
      <span class="aisth-palette-font" style="--font-color:#f17b2a;">ed</span>
      <span class="aisth-palette-label">ed</span>
    </div>

    <div class="aisth-palette-row is-font-only is-wide">
      <span class="aisth-palette-font is-gradient">be going to</span>
      <span class="aisth-palette-label">유사조동사</span>
    </div>
  </aside>

  <aside class="aisth-dev-panel" id="aisth-dev-question-list" data-aisth-dev-panel aria-live="polite">
    <div class="aisth-dev-panel-head">
      <div class="aisth-dev-panel-title">문제 - 답</div>
      <div class="aisth-dev-panel-meta" data-aisth-dev-meta>dev</div>
    </div>
    <div class="aisth-dev-panel-body" data-aisth-dev-body>
      <div class="aisth-dev-empty">문제 로드 대기 중</div>
    </div>
  </aside>

  <div class="popup-overlay" id="result-popup" aria-hidden="true" data-aisth-result-popup>
    <div class="popup-content" id="result-content" data-aisth-result-content></div>
  </div>

  <template id="aisth-question-shell-template">
    <section class="aisth-question-shell" data-aisth-question-shell>
      <div class="q-label" data-aisth-q-label></div>

      <div class="box aisth-question-box" data-aisth-question-box>
        <div class="aisth-question-meta" data-aisth-question-meta></div>
        <div class="aisth-question-instruction" data-aisth-question-instruction></div>
        <div class="aisth-question-body" data-aisth-question-body></div>
      </div>

      <div class="box aisth-answer-box" data-aisth-answer-box>
        <div class="aisth-answer-body" data-aisth-answer-body></div>
        <div class="feedback" data-aisth-feedback></div>
      </div>

      <div class="btn-row" data-aisth-actions>
        <button class="quiz-btn" type="button" data-aisth-action="submit">제출</button>
        <button class="quiz-btn" type="button" data-aisth-action="next" disabled>다음</button>
      </div>
    </section>
  </template>

  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="herma-toastfx.js"></script>
  <script src="dishquiz_resultstable.js"></script>
  <script src="../lesson-intro-player.js"></script>
  <script src="aisth-intro-fronts.js"></script>
  <script src="aisth-input-slots.js"></script>
  <script src="aisth-local-question-data.js"></script>
  <script src="aisth-frame-loader.js"></script>
  <script src="imsi_questions_compressor.js"></script>
  <script src="Imsi_resultstable_bridge.js"></script>
  <script src="Alpha_tester.js"></script>
</body>
</html>
