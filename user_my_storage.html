      function localScrapPoint(point, crop, width, height) {
        const source = point && typeof point === "object" ? point : {};
        return {
          x: ((Number(source.x) - crop.x) / crop.w) * width,
          y: ((Number(source.y) - crop.y) / crop.h) * height,
          p: Math.max(0.05, Math.min(1, Number(source.p) || 0.5))
        };
      }

      function drawScrapStroke(ctx, item, crop, width, height, inkScale) {
        const rawPoints = Array.isArray(item.points) ? item.points : [];
        const points = rawPoints.map(function (point) {
          return localScrapPoint(point, crop, width, height);
        }).filter(function (point) {
          return Number.isFinite(point.x) && Number.isFinite(point.y);
        });
        if (!points.length) return;
        const baseWidth = Math.max(0.7, Math.min(32, (Number(item.width) || 4) * inkScale));
        ctx.save();
        ctx.globalAlpha = 0.96;
        ctx.strokeStyle = safeText(item.color) || "#2f2a24";
        ctx.fillStyle = safeText(item.color) || "#2f2a24";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (points.length === 1) {
          ctx.beginPath();
          ctx.arc(points[0].x, points[0].y, baseWidth * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }
        ctx.lineWidth = baseWidth;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i += 1) {
          const point = points[i];
          const next = points[i + 1] || point;
          const endX = (point.x + next.x) * 0.5;
          const endY = (point.y + next.y) * 0.5;
          ctx.quadraticCurveTo(point.x, point.y, endX, endY);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawScrapHighlight(ctx, item, crop, width, height) {
        const rect = item && item.rect && typeof item.rect === "object" ? item.rect : {};
        const x = ((Number(rect.x) - crop.x) / crop.w) * width;
        const y = ((Number(rect.y) - crop.y) / crop.h) * height;
        const w = (Number(rect.w) / crop.w) * width;
        const h = (Number(rect.h) / crop.h) * height;
        if (![x, y, w, h].every(Number.isFinite)) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0.08, Math.min(0.78, Number(item.alpha) || 0.34));
        ctx.fillStyle = safeText(item.color) || "#fff1a6";
        ctx.fillRect(x, y, w, h);
        ctx.restore();
      }

      function drawScrapMark(ctx, item, crop, width, height, inkScale) {
        const x = ((Number(item.x) - crop.x) / crop.w) * width;
        const y = ((Number(item.y) - crop.y) / crop.h) * height;
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        const mark = safeText(item.mark);
        const size = Math.max(10, Math.min(220, (Number(item.size) || 24) * inkScale));
        const color = safeText(item.color) || "#d65d54";
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = Math.max(2, size * 0.12);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (mark === "check" || mark === "circle") {
          const r = size * 0.42;
          ctx.beginPath();
          ctx.moveTo(x - r * 0.72, y - r * 0.02);
          ctx.lineTo(x - r * 0.18, y + r * 0.56);
          ctx.lineTo(x + r * 0.82, y - r * 0.58);
          ctx.stroke();
        } else if (mark === "x") {
          const r = size * 0.42;
          ctx.beginPath();
          ctx.moveTo(x - r, y - r);
          ctx.lineTo(x + r, y + r);
          ctx.moveTo(x + r, y - r);
          ctx.lineTo(x - r, y + r);
          ctx.stroke();
        } else if (mark === "o") {
          ctx.beginPath();
          ctx.arc(x, y, size * 0.46, 0, Math.PI * 2);
          ctx.stroke();
        } else if (mark === "score") {
          ctx.font = "800 " + Math.max(14, size) + "px Arial, sans-serif";
          ctx.textBaseline = "middle";
          ctx.fillText(safeText(item.value) || "100", x, y);
        }
        ctx.restore();
      }

      function drawScrapPageInk(ctx, items, crop, width, height, basePageWidth) {
        if (!Array.isArray(items) || !items.length) return;
        const inkScale = Math.max(0.55, Math.min(2.5, width / Math.max(1, basePageWidth * crop.w)));
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, width, height);
        ctx.clip();
        items.forEach(function (item) {
          if (!item || typeof item !== "object") return;
          if (item.type === "stroke") {
            drawScrapStroke(ctx, item, crop, width, height, inkScale);
          } else if (item.type === "highlight") {
            drawScrapHighlight(ctx, item, crop, width, height);
          } else if (item.type === "mark") {
            drawScrapMark(ctx, item, crop, width, height, inkScale);
          }
        });
        ctx.restore();
      }

      async function renderProblemScrap(entry, raw, qNo, card, requestId) {
        const canvas = card.querySelector(".problem-scrap-canvas");
        const message = card.querySelector(".problem-scrap-message");
        const stage = card.querySelector(".problem-scrap-stage");
        const note = card.querySelector(".problem-scrap-note");
        const keepPanelTop = sentencePanelList.scrollTop <= 4;
        try {
          const crop = calculateProblemCrop(raw, qNo);
          if (!crop) throw new Error("Missing problem anchor");
          const pdfDocument = await fetchMockPdfDocument(entry, raw);
          if (!state.sentencePanelOpen || requestId !== state.sentencePanelRequestId || !card.isConnected) return;
          if (crop.page > pdfDocument.numPages) throw new Error("PDF page unavailable");
          const pdfPage = await pdfDocument.getPage(crop.page);
          if (!state.sentencePanelOpen || requestId !== state.sentencePanelRequestId || !card.isConnected) return;
          const baseViewport = pdfPage.getViewport({ scale: 1 });
          const stageWidth = Math.max(280, Math.round(stage.clientWidth || 560));
          const cssWidth = Math.max(252, Math.round(stageWidth * 0.9));
          const scale = cssWidth / Math.max(1, baseViewport.width * crop.w);
          const viewport = pdfPage.getViewport({ scale: scale });
          const cssHeight = Math.max(1, Math.round(baseViewport.height * crop.h * scale));
          const dpr = Math.max(1, Math.min(2, Number(window.devicePixelRatio) || 1));
          canvas.width = Math.ceil(cssWidth * dpr);
          canvas.height = Math.ceil(cssHeight * dpr);
          canvas.style.width = "90%";
          canvas.style.aspectRatio = cssWidth + " / " + cssHeight;
          canvas.hidden = false;
          const ctx = canvas.getContext("2d", { alpha: false });
          if (!ctx) throw new Error("Canvas unavailable");
          await pdfPage.render({
            canvasContext: ctx,
            viewport: viewport,
            transform: [
              dpr,
              0,
              0,
              dpr,
              -crop.x * viewport.width * dpr,
              -crop.y * viewport.height * dpr
            ]
          }).promise;
          if (!state.sentencePanelOpen || requestId !== state.sentencePanelRequestId || !card.isConnected) return;
          const pageInk = findLatestPageInk(entry);
          const items = pageInk && pageInk.pages && Array.isArray(pageInk.pages[String(crop.page)])
            ? pageInk.pages[String(crop.page)]
            : [];
          if (items.length) {
            ctx.save();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawScrapPageInk(ctx, items, crop, cssWidth, cssHeight, baseViewport.width);
            ctx.restore();
          }
          card.classList.add("is-ready");
          message.textContent = "";
          note.textContent = items.length ? TEXT.scrapbookReady : TEXT.scrapbookNoInk;
          if (keepPanelTop && state.sentencePanelSection === "scrap") sentencePanelList.scrollTop = 0;
          scheduleLandscapeScrapSync();
        } catch (error) {
          console.error("[MyStorage:Scrap]", error);
          if (!state.sentencePanelOpen || requestId !== state.sentencePanelRequestId || !card.isConnected) return;
          canvas.hidden = true;
          card.classList.add("is-error");
          message.textContent = TEXT.scrapbookFailed;
          note.textContent = safeText(error && error.message ? error.message : error);
          scheduleLandscapeScrapSync();
        }
      }

      function syncLandscapeScrapScroll() {
        landscapeScrapSyncRaf = 0;
        const scrapColumn = sentencePanelList.querySelector(".sentence-panel-scrap-column");
        const sentenceColumn = sentencePanelList.querySelector(".sentence-panel-sentence-column");
        if (!scrapColumn) return;
        if (!state.sentencePanelLandscape || !sentenceColumn) {
          scrapColumn.scrollTop = 0;
          return;
        }
        const scrapRange = Math.max(0, scrapColumn.scrollHeight - scrapColumn.clientHeight);
        const sentenceRange = Math.max(0, sentenceColumn.scrollHeight - sentenceColumn.clientHeight);
        if (scrapRange <= 0 || sentenceRange <= 0) {
          scrapColumn.scrollTop = 0;
          return;
        }
        const pairedOffset = Math.max(0, Math.min(scrapRange, sentenceColumn.scrollTop));
        scrapColumn.scrollTop = Math.round(pairedOffset);
      }

      function scheduleLandscapeScrapSync() {
        if (landscapeScrapSyncRaf) window.cancelAnimationFrame(landscapeScrapSyncRaf);
        landscapeScrapSyncRaf = window.requestAnimationFrame(syncLandscapeScrapScroll);

      async function fetchPayloadFromUrl(url, cache) {
        if (!url) return null;
        if (cache.has(url)) return cache.get(url);
        const promise = (async function () {
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const text = await response.text();
          const payload = parseJsonObject(text);
          if (!payload) throw new Error("Invalid JSON");
          return payload;
        })();
        cache.set(url, promise);
        return promise;
      }

      async function hydrateEntry(entry, urlCache) {
        let payload = entry.inlinePayload;
        let words = extractWordPairs(payload);
        if (!words.length && entry.servedUrl) {
          payload = await fetchPayloadFromUrl(entry.servedUrl, urlCache);
          words = extractWordPairs(payload);
        }
        entry.payload = payload;
        entry.words = words;
        refreshEntryIdentity(entry, payload);
        entry.state = words.length ? "ready" : "empty";
        entry.error = "";
      }

      async function hydrateEntries(entries) {
        const urlCache = new Map();
        let cursor = 0;
        let completed = 0;

        async function worker() {
          while (cursor < entries.length) {
            const index = cursor;
            cursor += 1;
            const entry = entries[index];
            try {
              await hydrateEntry(entry, urlCache);
            } catch (error) {
              entry.state = "error";
              entry.error = safeText(error && error.message ? error.message : error);
            }
            completed += 1;
            setSyncState(
              "loading",
              TEXT.loadingFiles + " " + completed + "/" + entries.length
            );
            if (completed === 1 || completed % 8 === 0 || completed === entries.length) {
              renderFolderCounts();
              renderFileList();
              syncRuntimeSelection();
              if (state.sentencePanelOpen) {
                void renderSentencePanel(getSelectedEntry());
              }
            }
          }
        }

        const workerCount = Math.min(LOAD_CONCURRENCY, Math.max(1, entries.length));
        const jobs = [];
        for (let i = 0; i < workerCount; i += 1) jobs.push(worker());
        await Promise.all(jobs);
      }

      function setSyncState(mode, label) {
        syncDot.classList.toggle("is-loading", mode === "loading");
        syncDot.classList.toggle("is-error", mode === "error");
        syncLabel.textContent = label || TEXT.idle;
      }

      function filteredEntries() {
        const predicate = folderPredicates[state.folder] || folderPredicates.mock;
        const query = state.search.toLocaleLowerCase();
        return state.entries.filter(function (entry) {
          if (!predicate(entry)) return false;
          if (!query) return true;
          return [
            entry.title,
            entry.fileName,
            entry.dateLabel,
            sourceLabel(entry)
          ].join(" ").toLocaleLowerCase().indexOf(query) >= 0;
        });
      }

      function getSelectedEntry() {
        return state.entries.find(function (entry) {
          return entry.id === state.selectedId;
        }) || null;
      }

      function renderFolderCounts() {
        Object.keys(folderPredicates).forEach(function (folder) {
          const count = state.entries.filter(folderPredicates[folder]).length;
          const label = document.querySelector('[data-folder-count="' + folder + '"]');
          if (label) label.textContent = String(count);
        });
      }

      function makeEmptyPanel() {
        const panel = document.createElement("div");
        panel.className = "empty-panel";
        const icon = document.createElement("div");
        icon.className = "empty-folder";
        icon.setAttribute("aria-hidden", "true");
        const title = document.createElement("div");
        title.className = "empty-title";
        title.textContent = TEXT.noFiles;
        const note = document.createElement("div");
        note.className = "empty-note";
        note.textContent = userId ? TEXT.noFilesNote : TEXT.idRequired;
        panel.append(icon, title, note);
        return panel;
      }

      function renderFileList() {
        const entries = filteredEntries();
        fileList.innerHTML = "";
        pathCurrent.textContent = folderLabels[state.folder] || TEXT.mock;
        selectionLabel.textContent = entries.length + " " + TEXT.files;

        if (!entries.length) {
          fileList.appendChild(makeEmptyPanel());
          return;
        }

        const fragment = document.createDocumentFragment();
        entries.forEach(function (entry) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "file-card" + (entry.id === state.selectedId ? " is-selected" : "");
          card.dataset.entryId = entry.id;

          const icon = document.createElement("span");
          icon.className = "file-icon";
          icon.textContent = "JSON";

          const main = document.createElement("span");
          main.className = "file-main";
          const title = document.createElement("span");
          title.className = "file-title";
          title.textContent = entry.title;
          const meta = document.createElement("span");
          meta.className = "file-meta";
          meta.textContent = [sourceLabel(entry), entry.dateLabel].filter(Boolean).join(" \u00B7 ");
          main.append(title, meta);

          const stat = document.createElement("span");
          stat.className = "file-stat";
          const count = document.createElement("span");
          count.className = "word-count";
          count.textContent = entry.state === "loading" ? "..." : entry.words.length + " W";
          const status = document.createElement("span");
          status.className = "file-state" + (entry.state === "error" ? " is-error" : "");
          if (entry.state === "loading") status.textContent = TEXT.loading;
          else if (entry.state === "error") status.textContent = TEXT.error;
          else if (entry.words.length) status.textContent = TEXT.words;
          else status.textContent = TEXT.empty;
          stat.append(count, status);

          card.append(icon, main, stat);
          card.addEventListener("click", function () {
            selectEntry(entry.id, false, true);
          });
          card.addEventListener("dblclick", function () {
            selectEntry(entry.id, true, true);
          });
          fragment.appendChild(card);
        });
        fileList.appendChild(fragment);
      }

      function shuffle(list) {
        const copy = list.slice();
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const value = copy[i];
          copy[i] = copy[j];
          copy[j] = value;
        }
        return copy;
      }

      function clearStudyTimers() {
        if (state.quizTimer) window.clearTimeout(state.quizTimer);
        if (state.stageAdvanceTimer) window.clearTimeout(state.stageAdvanceTimer);
        state.quizTimer = null;
        state.stageAdvanceTimer = null;
      }

      function hideRuntimeViews() {
        runtimeMessage.hidden = true;
        learnScroll.hidden = true;
        learnActions.hidden = true;
        quizArea.hidden = true;
        resultPopup.style.display = "none";
        resultPopup.innerHTML = "";
      }

      function showRuntimeMessage(title, note) {
        clearStudyTimers();
        hideRuntimeViews();
        runtimeMessageTitle.textContent = title;
        runtimeMessageNote.textContent = note;
        runtimeMessage.hidden = false;
      }

      function updateStageTrack() {
        const order = ["learn", "quiz1", "quiz2"];
        const current = order.indexOf(state.stage);
        order.forEach(function (stage, index) {
          const node = runtimeStages[stage];
          node.classList.toggle("is-current", index === current);
          node.classList.toggle("is-done", index < current || (stage === "quiz1" && state.quiz1Passed) || (stage === "quiz2" && state.quiz2Passed));
          node.classList.toggle("is-upcoming", index > current);
          node.classList.toggle("is-timed", stage === "quiz1" && index === current);
        });
        wordflowRuntime.dataset.wordStage = state.stage;
      }

      function eligibleWords(entry) {
        return entry.words.filter(function (item) {
          return safeText(item.word).trim() && safeText(item.meaning).trim();
        });
      }

        if (state.quizHintShown || !runtimeQuizHint) return;
        state.quizHintShown = true;
        runtimeQuizHint.textContent = TEXT.quizNavigationHint;
        runtimeQuizHint.hidden = false;
        runtimeQuizHint.classList.remove("is-showing");

      function makeLearnCard(item, index) {
        const card = document.createElement("article");
        card.className = "card";
        const watermark = document.createElement("div");
        watermark.className = "card-watermark";
        watermark.textContent = String(index + 1);
        const top = document.createElement("div");
        top.className = "card-top";
        const wrap = document.createElement("div");
        wrap.className = "word-wrap";
        const word = document.createElement("div");
        const wordLength = safeText(item.word).replace(/[^a-z]/gi, "").length;
        word.className = "word-title notranslate" + (
          wordLength >= 13 ? " is-long is-very-long" : wordLength >= 10 ? " is-long" : ""
        );
        word.setAttribute("translate", "no");
        word.textContent = item.word;
        const meaning = document.createElement("div");
        meaning.className = "meaning";
        meaning.tabIndex = 0;
        meaning.textContent = item.meaning || "\u2014";
        wrap.appendChild(word);
        top.append(wrap, meaning);
        const pos = document.createElement("div");
        pos.className = "pos";
        if (item.qNo) {
          pos.textContent = "(" + item.qNo + TEXT.question + ")";
          card.append(watermark, top, pos);
        } else {
          card.append(watermark, top);
        }

        function toggleLocal() {
          card.classList.toggle("hide-meaning-local");
        }
        meaning.addEventListener("click", toggleLocal);
        meaning.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleLocal();
          }
        });
        return card;
      }

      function startRuntimeQuiz1TitleDemo() {
        const demo = quizArea.querySelector(".wf-q1-title-demo");
        if (!demo) return;
        const timer = demo.querySelector(".wf-q1-demo-timer > i");
        const word = demo.querySelector(".wf-q1-demo-word");
        const answer = demo.querySelector(".wf-q1-demo-choices > .is-answer");
        const instruction = demo.querySelector(".wf-q1-demo-instruction");
        const complete = demo.querySelector(".wf-q1-demo-complete");

        const run = function () {
          if (!demo.isConnected || quizArea.hidden) return;
          let remaining = 100;
          if (word) word.classList.remove("is-correct");
          if (answer) answer.classList.remove("is-demo-pressing", "is-selected");
          if (instruction) instruction.classList.remove("is-hidden");
          if (complete) complete.classList.remove("is-visible");
          if (timer) timer.style.width = "100%";

          const timerInterval = window.setInterval(function () {
            if (!demo.isConnected || quizArea.hidden) {
              window.clearInterval(timerInterval);
              return;
            }
            remaining = Math.max(18, remaining - 3);
            if (timer) timer.style.width = remaining + "%";
          }, 45);

          window.setTimeout(function () {
            if (!demo.isConnected || quizArea.hidden) return;
            if (answer) answer.classList.add("is-demo-pressing");
          }, 1260);

          window.setTimeout(function () {
            if (!demo.isConnected || quizArea.hidden) return;
            window.clearInterval(timerInterval);
            if (answer) {
              answer.classList.remove("is-demo-pressing");
              answer.classList.add("is-selected");
            }
            if (word) word.classList.add("is-correct");
            if (instruction) instruction.classList.add("is-hidden");
            if (complete) complete.classList.add("is-visible");
          }, 1420);

          window.setTimeout(run, 2850);
        };

        run();
      }

      function renderRuntimeQuiz2TitleDemo() {
        return [
          '<div class="wf-q2-title-demo" aria-hidden="true">',
          '<div class="wf-q2-demo-prompt"><span>MEANING</span><strong>\uB2E8\uC5B4</strong></div>',
          '<div class="wf-q2-demo-slots"><span>W</span><span>O</span><span>R</span><span>D</span></div>',
          '<div class="wf-q2-demo-bank">',
          '<span class="is-r">R</span><span class="is-w">W</span>',
          '<span class="is-d">D</span><span class="is-o">O</span>',
          '</div>',

          '</div>'

      function startRuntimeQuiz2TitleDemo() {
        const demo = quizArea.querySelector(".wf-q2-title-demo");
        if (!demo) return;
        const slots = Array.from(demo.querySelectorAll(".wf-q2-demo-slots > span"));
        const bank = {
          W: demo.querySelector(".wf-q2-demo-bank > .is-w"),
          O: demo.querySelector(".wf-q2-demo-bank > .is-o"),
          R: demo.querySelector(".wf-q2-demo-bank > .is-r"),
          D: demo.querySelector(".wf-q2-demo-bank > .is-d")
        };
        const instruction = demo.querySelector(".wf-q2-demo-instruction");
        const complete = demo.querySelector(".wf-q2-demo-complete");
        const sequence = ["W", "O", "R", "D"];

        const reset = function () {
          slots.forEach(function (slot) { slot.classList.remove("is-filled"); });
          Object.values(bank).forEach(function (tile) {
            if (tile) tile.classList.remove("is-demo-pressing", "is-used");
          });
          if (instruction) instruction.classList.remove("is-hidden");
          if (complete) complete.classList.remove("is-visible");
        };

        const run = function () {
          if (!demo.isConnected || quizArea.hidden) return;
          reset();
          sequence.forEach(function (letter, index) {
            const pressAt = 580 + (index * 610);
            window.setTimeout(function () {
              if (!demo.isConnected || quizArea.hidden) return;
              if (bank[letter]) bank[letter].classList.add("is-demo-pressing");
            }, pressAt);
            window.setTimeout(function () {
              if (!demo.isConnected || quizArea.hidden) return;
              if (bank[letter]) {
                bank[letter].classList.remove("is-demo-pressing");
                bank[letter].classList.add("is-used");
              }
              if (slots[index]) slots[index].classList.add("is-filled");
            }, pressAt + 155);
          });
          window.setTimeout(function () {
            if (!demo.isConnected || quizArea.hidden) return;
            if (instruction) instruction.classList.add("is-hidden");
            if (complete) complete.classList.add("is-visible");
          }, 3100);
          window.setTimeout(run, 4400);
        };

        run();
      }

      function buildMeaningOptions(question) {
        const allMeanings = eligibleWords(getSelectedEntry()).map(function (item) {
          return item.meaning;
        }).filter(function (meaning, index, list) {
          return list.indexOf(meaning) === index && meaning !== question.meaning;
        });
        return shuffle([question.meaning].concat(shuffle(allMeanings).slice(0, 3)));
      }

      function questionProgressMarkup(current, total) {
        return [
          '<div class="wf-question-progress" aria-label="Current question ' + current + ' of ' + total + '">',
          '<span class="is-current-count"><small>CURRENT</small><strong>' + String(current).padStart(2, "0") + '</strong></span>',
          '<i aria-hidden="true">/</i>',
          '<span><small>TOTAL</small><strong>' + String(total).padStart(2, "0") + '</strong></span>',
          '</div>'
        ].join("");
      }

      function renderQuiz1Question() {
        clearStudyTimers();
        if (state.quizIndex >= state.quizSet.length) {
          showQuizResult("quiz1");
          return;
        }
        state.quizAnswered = false;
        const question = state.quizSet[state.quizIndex];
        quizArea.classList.remove("is-correct", "is-wrong");
        quizArea.dataset.wfView = "question";
        quizArea.innerHTML = [
          '<div class="wf-q1-word-card">',
          '<span class="wf-q1-word-index">WORD</span>',

        ].join("");
        quizArea.hidden = false;
        quizArea.querySelector(".wf-q1-word").textContent = question.word;
        const options = quizArea.querySelector(".wf-q1-options");
        buildMeaningOptions(question).forEach(function (option, index) {
          const button = document.createElement("button");
          button.className = "quiz-btn";
          button.type = "button";
          button.dataset.choice = String.fromCharCode(65 + index);
          button.textContent = option;
          const cancelPress = function () {
            button.classList.remove("is-pressing");
          };
          button.addEventListener("pointerdown", function () {
            button.classList.add("is-pressing");
          });
          button.addEventListener("pointercancel", cancelPress);
          button.addEventListener("pointerleave", cancelPress);
          button.addEventListener("click", function () {
            options.querySelectorAll(".quiz-btn.is-selected").forEach(function (item) {
              item.classList.remove("is-selected");
            });
            button.classList.remove("is-pressing");
            button.classList.add("is-selected");
            answerQuiz1(option, button);
          });
          options.appendChild(button);
        });
        state.quizTimer = window.setTimeout(function () {
          answerQuiz1(null, null);
        }, 3000);
      }

      function answerQuiz1(selected, selectedButton) {
        if (state.quizAnswered) return;
        state.quizAnswered = true;
        if (state.quizTimer) window.clearTimeout(state.quizTimer);
        state.quizTimer = null;
        const question = state.quizSet[state.quizIndex];
        const correct = selected === question.meaning;
        state.quizResults.push({
          word: question.word,
          meaning: question.meaning,
          selected: selected || "\uC2DC\uAC04 \uCD08\uACFC",
          answer: question.meaning,
          correct: correct
        });
        quizArea.classList.add(correct ? "is-correct" : "is-wrong");
        quizArea.querySelectorAll(".wf-q1-options .quiz-btn").forEach(function (button) {
          button.disabled = true;
          if (button.textContent === question.meaning) button.classList.add("is-answer-choice");
          if (button === selectedButton) button.classList.add(correct ? "is-correct-choice" : "is-wrong-choice");
        });
        showDirectQuiz1Toast(correct, selected == null);
        state.stageAdvanceTimer = window.setTimeout(function () {
          state.quizIndex += 1;
          renderQuiz1Question();
        }, 850);
      }

          '<div class="start-guide">',
          '<div class="start-guide-item"><span class="start-guide-number">1</span><span>\uC11E\uC778 \uAE00\uC790\uB97C \uB20C\uB7EC \uBE48\uCE78\uC744 \uCC44\uC6B0\uC138\uC694.</span></div>',
          '<div class="start-guide-item"><span class="start-guide-number">2</span><span>\uCC44\uC6B4 \uCE78\uC744 \uB2E4\uC2DC \uB204\uB974\uBA74 \uAE00\uC790\uAC00 \uB3CC\uC544\uAC11\uB2C8\uB2E4.</span></div>',
          '</div>',
          '<div class="setup-status">' + total + ' WORDS \u00B7 PERSONAL STUDY</div>',
          '<button id="runtime-q2-start" class="quiz-btn" style="width:100%;" type="button">Start Quiz</button>',
          '</div>'
        ].join("");
        quizArea.hidden = false;
        startRuntimeQuiz2TitleDemo();
        document.getElementById("runtime-q2-start").addEventListener("click", function () {
          if (eligibleWords(entry).length < 2) {
            showRuntimeMessage(TEXT.quizNeed, TEXT.noWordData);
            return;
          }
          prepareQuizSet(entry);
          renderQuiz2Question();
        });
      }

      function createPuzzle(word) {
        const items = [];
        const layout = [];
        let slotIndex = 0;
        Array.from(word).forEach(function (char) {
          if (/[a-z0-9]/i.test(char)) {
            items.push({ id: items.length, char: char.toUpperCase() });
            layout.push({ type: "slot", slotIndex: slotIndex });
            slotIndex += 1;
          } else if (/\s/.test(char)) {
            layout.push({ type: "separator", char: "\u00A0" });
          } else {
            layout.push({ type: "fixed", char: char });
          }
        });
        return {
          items: shuffle(items),
          layout: layout,
          slotValues: new Array(slotIndex).fill(null),
          activeSlotIndex: slotIndex ? 0 : -1
        };
      }

      function nextEmptySlot(puzzle, start) {
        for (let i = Math.max(0, start); i < puzzle.slotValues.length; i += 1) {
          if (puzzle.slotValues[i] === null) return i;
        }
        for (let i = 0; i < Math.max(0, start); i += 1) {
          if (puzzle.slotValues[i] === null) return i;
        }
        return -1;
      }

      function puzzleItem(puzzle, id) {
        return puzzle.items.find(function (item) { return item.id === id; }) || null;
      }

      function updateAnswerChipScale(answerEl, puzzle) {
        const itemCount = Math.max(1, puzzle.layout.length);
        const styles = getComputedStyle(answerEl);
        const padding = parseFloat(styles.paddingLeft || "0") + parseFloat(styles.paddingRight || "0");
        const measuredWidth = answerEl.clientWidth || (answerEl.parentElement ? answerEl.parentElement.clientWidth : 0);
        const innerWidth = Math.max(0, measuredWidth - padding - 2);
        const gap = itemCount > 10 ? 2 : (itemCount > 7 ? 3 : 7);
        const chipWidth = Math.max(
          14,
          Math.min(42, Math.floor((innerWidth - gap * (itemCount - 1)) / itemCount))
        );
        const chipHeight = Math.max(28, Math.min(52, Math.round(chipWidth * 1.24)));
        const lengthFontCap = itemCount >= 12 ? 14 : (itemCount >= 10 ? 17 : (itemCount >= 8 ? 20 : 25));
        const fontSize = Math.max(11, Math.min(lengthFontCap, Math.round(chipWidth * 0.6)));
        answerEl.dataset.answerLength = String(itemCount);
        answerEl.style.setProperty("--answer-chip-gap", gap + "px");
        answerEl.style.setProperty("--answer-chip-width", chipWidth + "px");
        answerEl.style.setProperty("--answer-chip-height", chipHeight + "px");
        answerEl.style.setProperty("--answer-chip-font", fontSize + "px");
        answerEl.style.setProperty("--answer-separator-font", Math.max(10, Math.min(20, fontSize)) + "px");
      }

      function renderPuzzleState() {
        const puzzle = state.q2Puzzle;
        const answer = document.getElementById("scramble-answer");
        const bank = document.getElementById("scramble-bank");
        if (!puzzle || !answer || !bank) return;
        if (
          puzzle.activeSlotIndex < 0 ||
          puzzle.slotValues[puzzle.activeSlotIndex] !== null
        ) {
          puzzle.activeSlotIndex = nextEmptySlot(puzzle, 0);
        }
        updateAnswerChipScale(answer, puzzle);
        answer.innerHTML = "";
        bank.innerHTML = "";
        puzzle.layout.forEach(function (part) {
          const chip = document.createElement(part.type === "slot" ? "button" : "span");
          chip.className = "slot-chip notranslate " + (part.type === "slot" ? "" : part.type);
          chip.setAttribute("translate", "no");
          if (part.type === "slot") {
            chip.type = "button";
            chip.dataset.slotIndex = String(part.slotIndex);
            const item = puzzleItem(puzzle, puzzle.slotValues[part.slotIndex]);
            const isFilled = !!item;
            chip.textContent = isFilled ? item.char : "\u00A0";
            chip.classList.toggle("empty", !isFilled);
            chip.classList.toggle("active", !isFilled && part.slotIndex === puzzle.activeSlotIndex);
            chip.addEventListener("click", function () {
              if (state.quizAnswered) return;
              puzzle.slotValues[part.slotIndex] = null;
              puzzle.activeSlotIndex = part.slotIndex;
              renderPuzzleState();
            });
          } else {
            chip.textContent = safeText(part.char).toUpperCase();
          }
          answer.appendChild(chip);
        });
        puzzle.items.forEach(function (item) {
          const button = document.createElement("button");
          button.type = "button";
          const used = puzzle.slotValues.indexOf(item.id) >= 0;
          button.className = "bank-letter notranslate" + (used ? " used" : "");
          button.setAttribute("translate", "no");
          button.dataset.bankId = String(item.id);
          button.textContent = item.char;
          button.disabled = used || state.quizAnswered;
          button.addEventListener("click", function () {
            if (state.quizAnswered || button.disabled) return;
            const slot = puzzle.activeSlotIndex >= 0
              ? puzzle.activeSlotIndex
              : nextEmptySlot(puzzle, 0);
            if (slot < 0) return;
            puzzle.slotValues[slot] = item.id;
            puzzle.activeSlotIndex = nextEmptySlot(puzzle, slot + 1);
            renderPuzzleState();
          });
          bank.appendChild(button);
        });
      }

      function getPuzzleAttempt(puzzle, emptyPlaceholder) {
        let slot = 0;
        return puzzle.layout.map(function (part) {
          if (part.type === "slot") {
            const item = puzzleItem(puzzle, puzzle.slotValues[slot]);
            slot += 1;
            return item ? item.char : (emptyPlaceholder || "");
          }
          return part.type === "separator" ? " " : part.char;
        }).join("");
      }

      function renderQuiz2Question() {
        if (state.quizIndex >= state.quizSet.length) {
          showQuizResult("quiz2");
          return;
        }
        state.quizAnswered = false;
        const question = state.quizSet[state.quizIndex];
        state.q2Puzzle = createPuzzle(question.word);
        quizArea.dataset.wfView = "question";
        quizArea.innerHTML = [
          '<div class="quiz-question-screen notranslate" translate="no">',
          '<div class="question-top"><div class="wf-question-context">PERSONAL SET</div>' + questionProgressMarkup(state.quizIndex + 1, state.quizSet.length) + '</div>',
          '<div class="meaning-card"><div class="question-wording"></div></div>',
          '<div id="scramble-answer" class="scramble-wrap notranslate" translate="no"></div>',
          '<div class="bank-label notranslate" translate="no">Scrambled letters</div>',
          '<div id="scramble-bank" class="bank-grid notranslate" translate="no"></div>',
          '<div id="feedback"></div>',
          '<button class="quiz-btn check-btn notranslate" id="runtime-check-btn" type="button">Check</button>',
          '<div id="answer-toast" class="answer-toast notranslate" translate="no"></div>',
          '</div>'
        ].join("");
        quizArea.hidden = false;
        quizArea.querySelector(".question-wording").textContent = question.meaning;
        document.getElementById("runtime-check-btn").addEventListener("click", submitPuzzle);
        renderPuzzleState();
      }

      function submitPuzzle() {
        if (state.quizAnswered || !state.q2Puzzle) return;
        const question = state.quizSet[state.quizIndex];
        const attempt = getPuzzleAttempt(state.q2Puzzle, "_");
        const attemptValue = getPuzzleAttempt(state.q2Puzzle, "");
        const fullyFilled = state.q2Puzzle.slotValues.every(function (value) { return value !== null; });
        state.quizAnswered = true;
        const normalize = function (value) {
          return safeText(value).replace(/\s+/g, " ").trim().toLocaleLowerCase();
        };
        const correct = fullyFilled && normalize(attemptValue) === normalize(question.word);
        state.quizResults.push({
          word: question.word,
          meaning: question.meaning,
          selected: attempt,
          answer: question.word,
          correct: correct
        });
        renderPuzzleState();
        quizArea.querySelectorAll("button").forEach(function (button) {
          button.disabled = true;
        });
        const answer = document.getElementById("scramble-answer");
        if (answer) answer.classList.add(correct ? "correct-glow" : "incorrect-glow");
        const toast = document.getElementById("answer-toast");
        toast.className = "wf-q1-answer-toast wf-q2-answer-toast " + (correct ? "correct" : "wrong");
        toast.setAttribute("role", "status");
        toast.setAttribute("aria-live", "assertive");
        toast.innerHTML = '<strong>' + (correct ? "\u2713" : "\u00D7") + '</strong><span>' + (correct ? "CORRECT!" : "WRONG!") + '</span>';
        void toast.offsetWidth;
        toast.classList.add("show");
        window.setTimeout(function () {
          if (toast.isConnected) toast.remove();
        }, 780);
        state.stageAdvanceTimer = window.setTimeout(function () {
          state.quizIndex += 1;
          renderQuiz2Question();
        }, correct ? 1150 : 900);
      }

      function makeResultTable(stage) {
        const table = document.createElement("table");
        table.className = "wf-result-table" + (stage === "quiz2" ? " is-q2 storage-q2-result-table" : "");
        if (stage === "quiz2") {
          const colgroup = document.createElement("colgroup");
          ["number", "source", "meaning", "attempt", "answer", "verdict"].forEach(function (name) {
            const col = document.createElement("col");
            col.className = "wf-col-" + name;
            colgroup.appendChild(col);
          });
          table.appendChild(colgroup);
        }
        const head = document.createElement("thead");
        const headRow = document.createElement("tr");
        const labels = stage === "quiz2"
          ? ["#", "\uCD9C\uCC98", TEXT.hideMeanings, "\uB0B4 \uB2F5\uC548", "\uC815\uB2F5", "\uACB0\uACFC"]
          : ["#", TEXT.words, "\uB0B4 \uB2F5\uC548", "\uC815\uB2F5", "\uACB0\uACFC"];
        labels.forEach(function (label) {
          const th = document.createElement("th");
          th.textContent = label;
          headRow.appendChild(th);
        });
        head.appendChild(headRow);
        const body = document.createElement("tbody");
        state.quizResults.forEach(function (result, index) {
          const row = document.createElement("tr");
          row.className = "is-main";
          const values = stage === "quiz2"
            ? [index + 1, sourceLabel(getSelectedEntry()), result.meaning, result.selected, result.answer]
            : [index + 1, result.word, result.selected, result.answer];
          values.forEach(function (value) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });
          const verdict = document.createElement("td");
          const mark = document.createElement("span");
          mark.className = "wf-result-verdict " + (result.correct ? "is-correct" : "is-wrong");
          mark.textContent = result.correct ? "\u2713" : "\u00D7";
          verdict.appendChild(mark);
          row.appendChild(verdict);
          body.appendChild(row);
        });
        table.append(head, body);
        return table;
      }

      function showQuizResult(stage) {
        clearStudyTimers();
        const total = state.quizResults.length;
        const correct = state.quizResults.filter(function (result) { return result.correct; }).length;
        const score = total ? Math.round((correct / total) * 100) : 0;
        if (stage === "quiz1") state.quiz1Passed = true;
        if (stage === "quiz2") state.quiz2Passed = true;
        updateStageTrack();
        resultPopup.innerHTML = [
          '<div class="popup-content wf-result-content">',
          '<div class="wf-result-header"><span class="wf-result-kicker">' + (stage === "quiz1" ? "WORD QUIZ" : "SPELLING QUIZ") + ' \u00B7 RESULT</span><h2>' + (stage === "quiz1" ? "\uB73B \uACE0\uB974\uAE30 \uACB0\uACFC" : "\uB2E8\uC5B4 \uC870\uB9BD \uACB0\uACFC") + '</h2></div>',
          '<div class="wf-result-score is-pass">',
          '<div class="wf-result-score-number"><strong>' + score + '</strong><span>\uC810</span></div>',
          '<div class="wf-result-score-copy"><span>\uC815\uB2F5</span><strong>' + correct + ' / ' + total + '</strong><small>PERSONAL STUDY</small></div>',
          '</div>',
          '<div class="wf-result-status is-pass"><span aria-hidden="true">\u2713</span><strong>\uD559\uC2B5 \uAE30\uB85D\uC774 \uC800\uC7A5\uB418\uC5C8\uC2B5\uB2C8\uB2E4.</strong></div>',
          '<div class="wf-result-detail" id="storage-result-detail"></div>',
          '<div class="wf-result-actions"><button class="quiz-btn secondary" id="runtime-result-back" type="button">\uB2E4\uC2DC \uD480\uAE30</button><button class="quiz-btn" id="runtime-result-next" type="button">' + (stage === "quiz1" ? "\uB2E4\uC74C \uB2E8\uACC4\uB85C" : "MEM") + '</button></div>',
          '</div>'
        ].join("");
        document.getElementById("storage-result-detail").appendChild(makeResultTable(stage));
        resultPopup.style.display = "flex";
        document.getElementById("runtime-result-back").addEventListener("click", function () {
          setStage(stage);
        });
        const next = document.getElementById("runtime-result-next");
        next.addEventListener("click", function () {
          setStage(stage === "quiz1" ? "quiz2" : "learn");
        });
      }

      function setStage(stage) {
        clearStudyTimers();
        state.stage = stage;
        state.quizIndex = 0;
        state.quizResults = [];
        state.quizAnswered = false;
        state.q2Puzzle = null;
        const entry = getSelectedEntry();
        if (!entry) {
          showRuntimeMessage(TEXT.selectBook, TEXT.selectBookNote);
          updateStageTrack();
          return;
        }
        if (stage === "learn") renderLearn(entry);
        else if (stage === "quiz1") renderQuiz1Intro(entry);
        else renderQuiz2Intro(entry);
      }

      function renderRuntime() {
        const entry = getSelectedEntry();
        if (!entry) {
          showRuntimeMessage(TEXT.selectBook, TEXT.selectBookNote);
          updateStageTrack();
          return;
        }
        if (entry.state === "loading") {
          showRuntimeMessage(entry.title, TEXT.preparing);
          updateStageTrack();
          return;
        }
        if (entry.state === "error" || !entry.words.length) {
          const note = entry.state === "error"
            ? TEXT.loadFailed + (entry.error ? " (" + entry.error + ")" : "")
            : TEXT.noWordData;
          showRuntimeMessage(entry.title, note);
          updateStageTrack();
          return;
        }
        if (state.stage === "quiz1") renderQuiz1Intro(entry);
        else if (state.stage === "quiz2") renderQuiz2Intro(entry);
        else renderLearn(entry);
      }

      function syncRuntimeSelection(force) {
        const entry = getSelectedEntry();
        const entryId = entry ? entry.id : "";
        const entryState = entry ? entry.state : "";
        if (force || state.runtimeEntryId !== entryId || state.runtimeEntryState !== entryState) {
          resetRuntimeForEntry(entry);
          renderRuntime();
        }
      }

      function clearRuntimeSelection() {
        closeSentencePanel();
        state.selectedId = "";
        resetRuntimeForEntry(null);
        renderFileList();
        renderRuntime();
      }

      function selectEntry(entryId, focusRuntime, showSentences) {
        state.selectedId = entryId;
        const entry = getSelectedEntry();
        resetRuntimeForEntry(entry);
        renderFileList();
        renderRuntime();
        if (showSentences) openSentencePanel(entry);
        if (focusRuntime && window.innerWidth <= 830) {
          wordflowRuntime.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      function renderAll() {
        document.querySelectorAll("[data-folder]").forEach(function (button) {
          button.classList.toggle("is-active", button.dataset.folder === state.folder);
        });
        renderFolderCounts();
        renderFileList();
        syncRuntimeSelection();
      }

      async function refreshLibrary() {
        if (state.loading) return;
        state.loading = true;
        refreshBtn.disabled = true;
        state.selectedId = "";
        closeSentencePanel();
        state.entries = [];
        setSyncState("loading", TEXT.loadingList);
        renderAll();

        if (!userId) {
          state.loading = false;
          refreshBtn.disabled = false;
          setSyncState("error", TEXT.idRequired);
          renderAll();
          return;
        }

        try {
          const url = new URL(LIVE_RECEIVE_URL);
          url.searchParams.set("userId", userId);
          url.searchParams.set("limit", String(RECEIVE_LIMIT));
          const response = await fetch(url.toString(), { cache: "no-store" });
          const rawText = await response.text();
          const payload = rawText ? JSON.parse(rawText) : [];
          if (!response.ok) {
            const message = payload && payload.message ? payload.message : "HTTP " + response.status;
            throw new Error(message);
          }

          const rows = parseReceiveRows(payload);
          const entries = rows.map(buildEntry);
          entries.sort(function (a, b) { return b.sortValue - a.sortValue; });
          state.entries = entries;
          renderAll();

          const serverEntries = entries.filter(function (entry) { return entry.kind === "server"; });
          await hydrateEntries(serverEntries);
          state.entries.sort(function (a, b) { return b.sortValue - a.sortValue; });

          const firstWithWords = state.entries.find(function (entry) {
            return entry.category === state.folder && entry.words.length > 0;
          });
          const fallbackWithWords = state.entries.find(function (entry) {
            return entry.words.length > 0;
          });
          const initialEntry = firstWithWords || fallbackWithWords;
          if (!getSelectedEntry() && initialEntry) {
            state.selectedId = initialEntry.id;
            state.folder = initialEntry.category;
          }
          setSyncState("ready", TEXT.loaded + " \u00B7 " + rows.length + " " + TEXT.files);
        } catch (error) {
          console.error("[MyStorage]", error);
          state.entries = [];
          setSyncState("error", TEXT.loadFailed);
        } finally {
          state.loading = false;
          refreshBtn.disabled = false;
          renderAll();
        }
      }

      function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        clockLabel.textContent = time;
      }

      function buildTabletUrl() {
        const target = new URL("tablet_screen.html", location.href);
        if (userId) target.searchParams.set("id", userId);
        return target.toString();
      }

      idLabel.textContent = userId ? "ID " + userId : TEXT.guest;
      updateClock();
      setInterval(updateClock, 15000);

      document.querySelectorAll("[data-folder]").forEach(function (button) {
        button.addEventListener("click", function () {
          closeSentencePanel();
          state.folder = button.dataset.folder || "mock";
          const visible = filteredEntries();
          const selected = getSelectedEntry();
          if (!selected || selected.category !== state.folder) {
            const first = visible.find(function (entry) { return entry.words.length > 0; }) || visible[0] || null;
            state.selectedId = first ? first.id : "";
            resetRuntimeForEntry(first);
          }
          renderAll();
        });
      });

      searchInput.addEventListener("input", function () {
        state.search = String(searchInput.value || "").trim();
        renderFileList();
      });

      refreshBtn.addEventListener("click", function () {
        void refreshLibrary();
      });

      backToTabletBtn.addEventListener("click", function () {
        location.href = buildTabletUrl();
      });

      maskBtn.addEventListener("click", function () {
        if (!getSelectedEntry() || state.stage !== "learn") return;
        state.meaningsHidden = !state.meaningsHidden;
        renderLearn(getSelectedEntry());
      });

      quizBtn.addEventListener("click", function () {
        if (!getSelectedEntry()) return;
        setStage("quiz1");
      });

      runtimeBackBtn.addEventListener("click", clearRuntimeSelection);

      runtimeStages.learn.addEventListener("click", function () {
        if (getSelectedEntry()) setStage("learn");
      });
      runtimeStages.quiz1.addEventListener("click", function () {
        if (getSelectedEntry()) setStage("quiz1");
      });
      runtimeStages.quiz2.addEventListener("click", function () {
        if (getSelectedEntry()) setStage("quiz2");
      });

      sentencePanelClose.addEventListener("click", closeSentencePanel);
      sentencePanelTabs.forEach(function (button) {
        button.addEventListener("click", function () {
          setSentencePanelSection(button.dataset.sentenceSection, true);
        });
      });
      sentencePanelLandscapeTab.addEventListener("click", function () {
        setSentencePanelLandscape(!state.sentencePanelLandscape);
      });
      sentencePanelList.addEventListener("scroll", function (event) {
        const target = event.target;
        if (
          state.sentencePanelLandscape &&
          target instanceof Element &&
          target.classList.contains("sentence-panel-sentence-column")
        ) {
          scheduleLandscapeScrapSync();
        }
      }, true);
      window.addEventListener("resize", function () {
        if (state.sentencePanelOpen) {
          scheduleDirectTranslationSurfaceRefresh();
          scheduleLandscapeScrapSync();
        }
      });

      void refreshLibrary();
    })();
  </script>
