<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dish Learn · 25D</title>
  <link rel="stylesheet" href="styles-frame.css" />
  <link rel="stylesheet" href="styles-room.css" />
  <link rel="stylesheet" href="styles-wordlist.css" />
  <link rel="stylesheet" href="dish-wordflow-25d.css?v=20260731m" />

<body class="wordflow-25d" data-word-stage="learn">
  <div class="main-page">
    <div id="cafe_int">
      <div id="learn-scroll">
        <div id="learn-content">
          <div class="card title-card">
            <div id="day-title" class="word-title">Day 1</div>
          </div>
          <div class="vine-divider title-divider"></div>
          <div id="status">Loading cards...</div>
          <div id="main"></div>
        </div>
      </div>

      <div class="learn-actions">
        <button id="back-btn" class="learn-btn back" type="button">Back</button>
        <button id="mask-btn" class="learn-btn mask" type="button" aria-pressed="false">뜻 가리기</button>
        <button id="quiz-btn" class="learn-btn quiz" type="button">시험볼게요</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="dish-retake-lock.js"></script>
  <script src="dish-wordflow-shell.js?v=20260731i"></script>
  <script src="dish-learn-25d.js?v=20260731c"></script>
