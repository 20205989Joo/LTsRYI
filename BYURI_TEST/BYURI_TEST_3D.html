<style>

*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#2f383d 0%,#53464b 58%,#2e2b31 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f1ece4}
button{font:inherit}
#gameDesk{width:100vw;height:100vh;height:100svh;display:block;padding:0;position:relative;overflow:hidden}

#gameShell{position:absolute;left:50%;top:50%;width:90.6667%;height:93.8531%;transform:translate(-50%,-50%);overflow:hidden;border-radius:20px;background:#71503f;border:3px solid #2b2020;box-shadow:inset 0 0 0 2px rgba(255,255,255,.10),0 8px 0 rgba(30,22,23,.9)}

#game{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;background:#705041}

#crosshair::before{width:3px;height:18px;left:7px;top:0;border-radius:99px}
#crosshair::after{width:18px;height:3px;left:0;top:7px;border-radius:99px}
#hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:12;max-width:calc(100% - 20px);padding:7px 10px;border-radius:999px;background:rgba(48,36,35,.76);border:1px solid rgba(238,233,224,.28);color:#eee8df;font-size:10px;white-space:nowrap;opacity:.78}
.worldEnergyBar{position:absolute;z-index:14;width:70px;height:13px;transform:translate(-50%,-50%);pointer-events:none;display:none}
.worldEnergyTrack{position:absolute;inset:0;border-radius:999px;background:rgba(48,36,35,.88);border:2px solid rgba(232,227,218,.88);box-shadow:0 3px 0 rgba(48,36,35,.45);overflow:hidden}
.worldEnergyFill{height:100%;width:0%;border-radius:999px;background:#7fe5d9;box-shadow:inset 0 2px 0 rgba(255,255,255,.34)}

.tapPill{position:absolute;right:-14px;top:-24px;display:none;padding:3px 7px;border-radius:999px;background:#e6e1d8;border:2px solid #302423;color:#302423;font-size:10px;font-weight:950;text-transform:uppercase;box-shadow:0 3px 0 rgba(48,36,35,.45);animation:tapHop .72s ease-in-out infinite}

.windowHeader{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:#302423;font-weight:950;letter-spacing:0}
#closeWindow{width:30px;height:30px;border-radius:10px;border:2px solid #302423;background:#e98787;color:#302423;box-shadow:0 3px 0 rgba(48,36,35,.45);cursor:pointer;font-weight:950}
#questionText{padding:12px;border-radius:12px;background:#f1ede6;border:2px solid rgba(48,36,35,.28);font-size:14px;line-height:1.45;margin-bottom:10px;color:#302423}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choiceBtn{min-height:42px;padding:9px 8px;border-radius:12px;border:2px solid #302423;background:#8ae6cf;color:#302423;box-shadow:0 4px 0 rgba(48,36,35,.45);cursor:pointer;font-weight:950;transition:transform .12s,filter .12s}
.choiceBtn:hover{transform:translateY(-1px);filter:brightness(1.04)}
#resultText{min-height:18px;margin-top:8px;color:#2a7b66;font-size:12px;font-weight:850}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.92);z-index:60;padding:10px 15px;border-radius:999px;background:#e6e1d8;border:2px solid #302423;box-shadow:0 5px 0 rgba(48,36,35,.5),0 18px 26px rgba(0,0,0,.22);color:#302423;font-weight:950;opacity:0;pointer-events:none;white-space:nowrap}
#toast.show{animation:toastPop .54s ease-out forwards}
#toast.good{background:#9fe6d5;color:#184233}
#toast.bad{background:#e99a9c;color:#4b1f1b}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-68%) scale(.96)}}

.miniStat{padding:9px;border-radius:12px;background:#f1ede6;border:2px solid rgba(48,36,35,.32)}

#leftPanel,#rightPanel{position:fixed;top:50%;transition:transform .18s ease;display:block}
#leftPanel{left:12px;transform:translate(calc(-100% - 18px),-50%)}
#rightPanel{right:12px;transform:translate(calc(100% + 18px),-50%)}
body.left-panel-open #leftPanel{transform:translate(0,-50%)}

function makeToonMaterial(color,roughness=.74,emissive=0x000000,emissiveIntensity=0){
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness:.02,
    emissive,
    emissiveIntensity
  });
}

function addOutlinedMesh(parent,mesh,scale=1.045,color=0x2f2528){
  parent.add(makeMeshOutline(mesh,scale,color));
  parent.add(mesh);

  return mesh;
}

function createLaneStrips(){
  directions.forEach(dir=>{
    const a=degToRad(dir.degree);
    const vx=Math.cos(a);
    const vz=-Math.sin(a);
    const sideX=Math.cos(a+Math.PI/2);
    const sideZ=-Math.sin(a+Math.PI/2);

    const strip=new THREE.Mesh(
      new THREE.PlaneGeometry(4.2,72),
      new THREE.MeshBasicMaterial({
        color:0x5f3f38,
        transparent:true,
        opacity:.18,
        side:THREE.DoubleSide
      })
    );

    strip.rotation.x=-Math.PI/2;
    strip.rotation.z=Math.PI/2-a;
    strip.position.set(vx*20,.032,vz*20);
    scene.add(strip);

    const stoneMat=new THREE.MeshStandardMaterial({
      color:0x9f6f5c,
      roughness:.86,
      metalness:.01,
      emissive:0x3a1f1b,
      emissiveIntensity:.04,
      transparent:true,
      opacity:.72
    });

    for(let i=0;i<8;i++){
      const dist=10+i*4.8;
      const side=(i%2===0?-.46:.46)*(1+i*.025);
      const stone=new THREE.Mesh(new THREE.CylinderGeometry(.62,.76,.12,14),stoneMat);

      stone.position.set(vx*dist+sideX*side,.09,vz*dist+sideZ*side);
      stone.scale.set(1.25,1,.72);
      stone.rotation.y=-a+randFloat(-.18,.18);
      stone.castShadow=!isMobile;
      stone.receiveShadow=!isMobile;
      addOutlinedMesh(scene,stone,1.045,0x30272a);
    }
  });

  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(5.65,.09,8,72),
    new THREE.MeshBasicMaterial({
      color:0x64d2c4,
      transparent:true,
      opacity:.38
    })
  );

  ring.rotation.x=Math.PI/2;
  ring.position.y=.13;
  scene.add(ring);
}
function createRuinProps(){
  const rockMat=makeToonMaterial(0x6f5049,.88,0x1d1110,.06);
  const shardMat=makeToonMaterial(0x7a5d6e,.84,0x20131c,.12);
  const coralMat=makeToonMaterial(0xb66f5e,.86,0x2d130f,.10);
  const targetCount=isMobile?20:32;
  let made=0;
  let tries=0;

  while(made<targetCount&&tries<900){
    tries++;

    const angle=Math.random()*Math.PI*2;
    const radius=15+Math.random()*82;
    const x=Math.cos(angle)*radius;
    const z=Math.sin(angle)*radius;

    if(Math.abs(x)<10&&Math.abs(z)<10)continue;
    if(isPointOnEnemyLane(x,z,8.5,76,8.2))continue;

    const roll=Math.random();
    const useShard=roll>.66;
    const geo=useShard
      ?new THREE.CylinderGeometry(.48,.92,2.0+Math.random()*3.7,5)
      :new THREE.DodecahedronGeometry(.75+Math.random()*1.45,0);
    const mat=useShard?shardMat:(roll>.34?rockMat:coralMat);
    const mesh=new THREE.Mesh(geo,mat);

    mesh.position.set(
      x,
      useShard?1.25+Math.random()*1.1:.58,
      z
    );

    mesh.rotation.set(Math.random()*.55,Math.random()*Math.PI,Math.random()*.45);
    mesh.scale.y*=.66+Math.random()*1.2;
    mesh.castShadow=!isMobile;
    mesh.receiveShadow=!isMobile;
    addOutlinedMesh(scene,mesh,1.035,0x30272a);
    made++;
  }
}
function isPointOnEnemyLane(x,z,minProj,maxProj,width){
  for(const dir of directions){
    const a=degToRad(dir.degree);
    const vx=Math.cos(a);
    const vz=-Math.sin(a);
    const proj=x*vx+z*vz;

    if(proj<minProj||proj>maxProj)continue;

    const perp=Math.abs(x*vz-z*vx);

    if(perp<width)return true;
  }

  return false;
}

function updateEnergyUI(cannon){
  const pct=clamp(cannon.energy/100,0,1);
  const percentText=Math.floor(cannon.energy)+"%";
  const ui=cannon.ui;

  ui.worldFill.style.width=(pct*100)+"%";
  ui.hudFill.style.width=(pct*100)+"%";
  ui.hudPct.textContent=percentText;

  ui.worldFill.style.opacity=cannon.charged?.98:.55;
  ui.hudFill.style.opacity=cannon.charged?.98:.55;
  if(ui.worldStats){
    ui.worldStats.innerHTML="<b>Lv."+cannon.level+"</b><span><i class=\"swordIcon\"></i>"+cannon.damage+"</span>";
  }
  ui.world.classList.toggle("needsTap",pct<.28||!cannon.charged);

  const p=cannon.group.position.clone();
  p.y+=1.32;
  p.project(camera);

  const visible=
    p.z>-1&&
    p.z<1&&
    p.x>-1.16&&
    p.x<1.16&&
    p.y>-1.12&&
    p.y<1.12;

  if(visible){
    const canvasRect=canvas.getBoundingClientRect();
    const shellRect=gameShell.getBoundingClientRect();
    const x=(p.x*.5+.5)*canvasRect.width+(canvasRect.left-shellRect.left);
    const y=(-p.y*.5+.5)*canvasRect.height+(canvasRect.top-shellRect.top);
    const scale=clamp(1.08-(p.z*.18),.78,1.18);

    ui.world.style.display="block";
    ui.world.style.left=x+"px";
    ui.world.style.top=y+"px";
    ui.world.style.transform="translate(-50%,-50%) scale("+scale+")";
  }else{
    ui.world.style.display="none";
  }
}

    b.userData.supportAngle=degToRad([58,118,76,137][i]||randFloat(50,140));
    b.userData.supportRadius=2.1+Math.random()*2.1;
    b.userData.supportHeight=1.85+Math.random()*1.15;
    b.userData.speedA=.68+Math.random()*.25;

    b.userData.phase=Math.random()*Math.PI*2;
    b.userData.mode="support";

  grad.addColorStop(0,"#f3f0ea");
  grad.addColorStop(.25,"#9fe6d5");
  grad.addColorStop(.58,"#6fb9d6");
  grad.addColorStop(.82,"#d9828a");
  grad.addColorStop(1,"#665071");

  ctx.fillStyle=grad;
  ctx.fillRect(0,0,128,256);

  ctx.fillStyle="rgba(255,255,255,.22)";
  ctx.fillRect(20,0,18,256);
  ctx.fillStyle="rgba(47,37,40,.10)";
  ctx.fillRect(92,0,10,256);

  const tex=new THREE.CanvasTexture(c);

}

function updateEnemyHpUI(enemy){
  const ui=enemy.hpUi;

  if(!ui)return;

  const pct=clamp(enemy.hp/enemy.maxHp,0,1);
  const p=enemy.mesh.position.clone();

  ui.fill.style.width=(pct*100)+"%";
  ui.text.textContent="HP "+Math.max(0,Math.ceil(enemy.hp));

  p.y+=2.05;
  p.project(camera);

  const visible=
    p.z>-1&&
    p.z<1&&
    p.x>-1.18&&
    p.x<1.18&&
    p.y>-1.12&&
    p.y<1.12;

  if(visible){
    const canvasRect=canvas.getBoundingClientRect();
    const shellRect=gameShell.getBoundingClientRect();
    const x=(p.x*.5+.5)*canvasRect.width+(canvasRect.left-shellRect.left);
    const y=(-p.y*.5+.5)*canvasRect.height+(canvasRect.top-shellRect.top);
    const scale=clamp(1.02-(p.z*.14),.72,1.08);

    ui.node.style.display="block";
    ui.node.style.left=x+"px";
    ui.node.style.top=y+"px";
    ui.node.style.transform="translate(-50%,-50%) scale("+scale+")";
  }else{
    ui.node.style.display="none";
  }
}

function syncViewportSize(){
  const wide=window.innerWidth>=900;
  const chromePad=wide?32:20;
  const panelBudget=wide?(224*2+18*2+32):20;
  const keyboardInputActive=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains("questionInput");
  if(!keyboardInputActive){
    stableViewportHeight=window.innerHeight;
  }
  const viewportH=keyboardInputActive?stableViewportHeight:window.innerHeight;
  const maxW=Math.max(240,window.innerWidth-panelBudget);
  const maxH=Math.max(420,viewportH-chromePad);
  const width=Math.min(375,maxW,maxH*375/667);
  const height=width*667/375;

  gameViewport.style.width=width+"px";
  gameViewport.style.height=height+"px";
}

function getRenderSize(){
  const rect=gameShell.getBoundingClientRect();

  return{
    width:Math.max(1,Math.round(rect.width||340)),
    height:Math.max(1,Math.round(rect.height||626))
  };
}

function onResize(){
  syncViewportSize();
  const size=getRenderSize();

  camera.aspect=size.width/size.height;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isMobile?1.75:2));
  renderer.setSize(size.width,size.height,false);
  cannons.forEach(updateEnergyUI);
}

function togglePanel(side,e){

function onPointerDown(e){
  if(game.gameOver)return;
  if(game.paused||game.debugPaused)return;
  if(statusWindow.classList.contains("show"))return;

  state.dragging=true;
  state.moved=false;
  state.lastX=e.clientX;
  state.lastY=e.clientY;
  state.downX=e.clientX;
  state.downY=e.clientY;
  state.dragX=0;
  state.dragY=0;
  state.dragYawOffset=0;

  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
}

function onPointerMove(e){
  if(!state.dragging)return;
  if(game.paused||game.debugPaused)return;
  if(statusWindow.classList.contains("show"))return;

  state.dragX=e.clientX-state.downX;
  state.dragY=e.clientY-state.downY;

  if(Math.abs(state.dragX)>4||Math.abs(state.dragY)>4){
    state.moved=true;
  }

  state.lastX=e.clientX;
  state.lastY=e.clientY;
  state.dragYawOffset=clamp(state.dragX*.0024,-.32,.32);
}

function onPointerUp(e){
  if(!state.dragging)return;

  const wasClick=
    !state.moved&&
    !statusWindow.classList.contains("show")&&
    !game.paused&&
    !game.debugPaused;

  const swipeX=state.lastX-state.downX;
  const swipeY=state.lastY-state.downY;

  state.dragging=false;
  state.dragYawOffset=0;
  canvas.classList.remove("dragging");

  if(wasClick){
    handleSceneClick(e.clientX,e.clientY);
  }else{
    snapViewFromSwipe(swipeX,swipeY);
  }
}

function setViewIndex(index){
  const next=clamp(Math.round(index),0,VIEW_SLOTS.length-1);

  state.viewIndex=next;
  state.targetYaw=VIEW_SLOTS[next].yaw;
}

function snapViewFromSwipe(deltaX,deltaY){
  const absX=Math.abs(deltaX);
  const absY=Math.abs(deltaY);

  if(absX<38||absX<absY*1.1)return;

  if(deltaX<0){
    setViewIndex(state.viewIndex+1);
  }else{
    setViewIndex(state.viewIndex-1);
  }
}

function handleSceneClick(x,y){
  const rect=canvas.getBoundingClientRect();

  if(rect.width<=0||rect.height<=0)return;

  const localX=(x-rect.left)/rect.width;
  const localY=(y-rect.top)/rect.height;

  if(localX<0||localX>1||localY<0||localY>1)return;

  pointer.x=localX*2-1;
  pointer.y=-(localY*2-1);

  raycaster.setFromCamera(pointer,camera);

  const hits=raycaster.intersectObjects(cannonClickTargets,true);

  if(hits.length>0){
    const idx=hits[0].object.userData.cannonIndex;
    openStatus(cannons[idx]);
  }
}

function openStatus(cannon){

  activeQuestion=q;

function makeQuestion(){
  if(window.ByuriQuestionBank&&typeof window.ByuriQuestionBank.create==="function"){
    return window.ByuriQuestionBank.create({randInt,shuffle});
  }

  const a=randInt(2,9);
  const b=randInt(2,9);
  const answer=a+b;
  const set=new Set([answer]);

  while(set.size<4){
    const value=answer+randInt(-4,4);

    if(value>=0&&value!==answer){
      set.add(value);
    }
  }

  return{
    id:"fallback-add",
    type:"multipleChoice",
    prompt:a+" + "+b+" = ?",
    answer,
    choices:shuffle([...set])
  };
}

function renderQuestion(question){
  const q=question||{};
  const type=q.type||"multipleChoice";

  questionText.textContent=q.prompt||q.text||"";
  choicesEl.innerHTML="";
  choicesEl.className="";
  answerWindow.classList.toggle("numericMode",type==="numericInput");
  answerWindow.classList.toggle("scrambleMode",type==="wordScramble");
  answerWindow.classList.remove("inputFocusMode");
  resultText.textContent="";

  if(type==="multipleChoice"){
    (q.choices||[]).forEach(choice=>{
      const btn=document.createElement("button");

      btn.className="choiceBtn";
      btn.textContent=choice;
      btn.addEventListener("click",()=>answerQuestion(choice));
      choicesEl.appendChild(btn);
    });

    return;
  }

  if(type==="numericInput"){
    const input=document.createElement("input");
    const submit=document.createElement("button");

    choicesEl.classList.add("numericChoices");
    input.className="questionInput";
    input.type="number";
    input.inputMode="numeric";
    input.placeholder="정답 입력";
    input.addEventListener("focus",()=>answerWindow.classList.add("inputFocusMode"));
    input.addEventListener("blur",()=>answerWindow.classList.remove("inputFocusMode"));
    input.addEventListener("keydown",event=>{
      if(event.key==="Enter"){
        event.preventDefault();
        answerQuestion(input.value);
      }
    });
    submit.className="choiceBtn";
    submit.textContent="OK";
    submit.addEventListener("click",()=>answerQuestion(input.value));
    choicesEl.appendChild(input);
    choicesEl.appendChild(submit);

    return;
  }

  if(type==="wordScramble"){
    const payload=q.payload||{};
    const letters=Array.isArray(payload.letters)&&payload.letters.length
      ? payload.letters
      : String(q.answer||"").replace(/[^a-zA-Z0-9]/g,"").split("");
    const answerBox=document.createElement("div");
    const bank=document.createElement("div");
    const controls=document.createElement("div");
    const del=document.createElement("button");
    const ok=document.createElement("button");
    const picked=[];
    let built="";

    choicesEl.classList.add("scrambleChoices");
    answerBox.className="scrambleAnswer empty";
    bank.className="scrambleBank";
    controls.className="scrambleControls";

    const update=()=>{
      answerBox.textContent=built||"글자를 눌러 단어 만들기";
      answerBox.classList.toggle("empty",!built);
    };

    letters.forEach(letter=>{
      const btn=document.createElement("button");
      const text=String(letter);

      btn.className="choiceBtn scrambleLetter";
      btn.type="button";
      btn.textContent=text;
      btn.addEventListener("click",()=>{
        if(btn.disabled)return;
        btn.disabled=true;
        picked.push({btn,letter:text});
        built+=text;
        update();
      });
      bank.appendChild(btn);
    });

    del.className="choiceBtn scrambleControl";
    del.type="button";
    del.textContent="DEL";
    del.addEventListener("click",()=>{
      const last=picked.pop();
      if(!last)return;
      last.btn.disabled=false;
      built=built.slice(0,Math.max(0,built.length-String(last.letter).length));
      update();
    });

    ok.className="choiceBtn scrambleControl";
    ok.type="button";
    ok.textContent="OK";
    ok.addEventListener("click",()=>answerQuestion(built));

    controls.appendChild(del);
    controls.appendChild(ok);
    choicesEl.appendChild(answerBox);
    choicesEl.appendChild(bank);
    choicesEl.appendChild(controls);
    update();
  }
}

function answerQuestion(choice){
  const cannon=activeCannon;

  [...document.querySelectorAll(".choiceBtn")].forEach(btn=>{
    btn.disabled=true;
  });
  [...document.querySelectorAll(".questionInput")].forEach(input=>{
    input.disabled=true;
  });

  const correct=activeQuestion&&typeof activeQuestion.checkAnswer==="function"
    ? activeQuestion.checkAnswer(choice,activeQuestion)
    : Number(choice)===Number(activeAnswer);

  if(correct){
    const evolved=chargeCannon(cannon);
    showToast(evolved?"진화 가능!":"정답 · 에너지 충전","good");
    closeStatus();
    updatePauseButton();

    if(evolved){
      setTimeout(()=>openUpgrade(cannon),190);
    }
  }else{
    showToast("오답","bad");
    closeStatus();
    updatePauseButton();
  }
}
function showToast(text,type){
  clearTimeout(toastTimer);

  toastEl.textContent=text;
  toastEl.className="";

  void toastEl.offsetWidth;

  toastEl.classList.add("show",type);

  toastTimer=setTimeout(()=>{
    toastEl.className="";
  },620);
}

function chargeCannon(cannon){
  cannon.correctCount++;
  cannon.energy=100;
  cannon.charged=true;

  let evolved=false;

  if(cannon.correctCount>=3){
    cannon.correctCount=0;
    evolved=true;
  }

  createBlessPulse(cannon.group.position,cannon.color);
  triggerByuriBlessing(cannon);

  return evolved;
}

function openUpgrade(cannon){
  if(!cannon||game.gameOver)return;

  game.paused=true;
  game.pendingUpgradeCannon=cannon;

  upgradeWindow.style.display="grid";
  upgradeTitle.textContent=cannon.name+" 포탑 진화";
  upgradeSub.textContent="강화 요소를 하나 선택하세요.";
  upgradeCards.innerHTML="";

  const picks=shuffle([...upgradePool]).slice(0,3);

  picks.forEach(upgrade=>{
    const card=document.createElement("button");

    card.className="upgradeCard";

    card.innerHTML=
      "<b>"+upgrade.title+"</b>"+
      "<span>"+upgrade.desc+"</span>";

    card.addEventListener("click",()=>applyUpgrade(cannon,upgrade));
    upgradeCards.appendChild(card);
  });
}

function applyUpgrade(cannon,upgrade){
  upgrade.apply(cannon);

  cannon.level++;
  cannon.damage=Math.round(cannon.damage*1.12+2);
  cannon.range+=1.8;
  cannon.glow.intensity+=.22;
  cannon.backCrystal.scale.multiplyScalar(1.09);

  createBlessPulse(cannon.group.position,cannon.color);
  triggerByuriBlessing(cannon);
  showToast(upgrade.title+" 적용","good");

  upgradeWindow.style.display="none";
  game.paused=false;
  game.debugPaused=false;
  game.pendingUpgradeCannon=null;
  updatePauseButton();
}

  const dir=directions[randInt(0,directions.length-1)];
  const a=degToRad(dir.degree);
  const radius=31+Math.random()*7;
  const x=Math.cos(a)*radius+randFloat(-2.5,2.5);
  const z=-Math.sin(a)*radius+randFloat(-2.5,2.5);
  const hpScale=1+game.elapsed*.0095;
  const hp=Math.round(game.enemyBaseHp*hpScale);

  const enemy=createSlimeEnemy(hp);
  enemy.mesh.position.set(x,.03,z);

  enemies.push(enemy);
  scene.add(enemy.mesh);
}

function fireProjectile(cannon,enemy,spread=0){
  const start=new THREE.Vector3();
  cannon.muzzle.getWorldPosition(start);

  const end=enemy.mesh.position.clone();
  end.y=.82;

  const dir=end.sub(start).normalize();

  if(spread!==0){
    dir.applyAxisAngle(new THREE.Vector3(0,1,0),spread);
  }

  const mesh=new THREE.Mesh(
    projectileGeo,
    new THREE.MeshBasicMaterial({
      color:cannon.color,
      transparent:true,
      opacity:.96
    })
  );

  mesh.scale.setScalar(1+cannon.level*.08);
  mesh.position.copy(start);

  const light=new THREE.PointLight(cannon.color,1.2,6.5,2);
  mesh.add(light);

  scene.add(mesh);

  projectiles.push({
    mesh,
    velocity:dir.multiplyScalar(23+cannon.level*1.5),
    damage:cannon.damage,
    life:2.1,
    color:cannon.color
  });
}

function fireCannon(cannon,enemy){
  fireProjectile(cannon,enemy,0);

  if(cannon.doubleShotChance>0&&Math.random()<cannon.doubleShotChance){
    fireProjectile(cannon,enemy,randFloat(-.08,.08));
  }
}

function fireBurst(cannon,target){
  const spreads=[-.18,-.09,0,.09,.18];
  spreads.forEach(spread=>fireProjectile(cannon,target,spread));
}

function updateCannonEnergy(dt){
  for(const cannon of cannons){
    const drain=cannon.charged?4.2:1.1;

    cannon.energy=Math.max(0,cannon.energy-drain*dt);

    if(cannon.energy<=0){
      cannon.charged=false;
    }

    updateEnergyUI(cannon);
  }
}

function updateCannons(dt){
  for(const cannon of cannons){
    cannon.fireTimer-=dt;
    cannon.burstTimer-=dt;

    const target=findTargetForCannon(cannon);

    if(target){
      const cpos=cannon.group.position;
      const epos=target.mesh.position;
      const dx=epos.x-cpos.x;
      const dz=epos.z-cpos.z;
      const desiredYaw=angleForXBarrel(dx,dz);
      const diff=normalizeAngle(desiredYaw-cannon.swivel.rotation.y);

      cannon.swivel.rotation.y+=diff*Math.min(1,dt*2.8);

      if(cannon.charged&&cannon.energy>0){
        if(cannon.burstEnabled&&cannon.burstTimer<=0){
          fireBurst(cannon,target);
          cannon.burstTimer=cannon.burstInterval;
          cannon.fireTimer=Math.max(cannon.fireTimer,.18);
        }

        if(cannon.fireTimer<=0){
          fireCannon(cannon,target);
          cannon.fireTimer=cannon.cooldown;
        }
      }
    }else{
      const diff=normalizeAngle(cannon.baseYaw-cannon.swivel.rotation.y);
      cannon.swivel.rotation.y+=diff*Math.min(1,dt*1.25);
    }
  }
}

function findTargetForCannon(cannon){
  let best=null;
  let bestScore=Infinity;

  for(const enemy of enemies){
    const cpos=cannon.group.position;
    const epos=enemy.mesh.position;
    const dist=flatDistance(cpos,epos);

    if(dist>cannon.range)continue;

    const dx=epos.x-cpos.x;
    const dz=epos.z-cpos.z;
    const targetYaw=angleForXBarrel(dx,dz);
    const angleDiff=Math.abs(normalizeAngle(targetYaw-cannon.baseYaw));

    if(angleDiff>.92)continue;

    const score=dist+angleDiff*12;

    if(score<bestScore){
      bestScore=score;
      best=enemy;
    }
  }

  return best;
}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const pos=e.mesh.position;
    const dx=-pos.x;
    const dz=-pos.z;
    const dist=Math.sqrt(dx*dx+dz*dz);

    if(dist>.001){
      pos.x+=dx/dist*e.speed*dt;
      pos.z+=dz/dist*e.speed*dt;
      e.mesh.rotation.y=yawForPlusZ(dx,dz);
    }

    e.wobble+=dt*6.8;

    const wob=Math.sin(e.wobble);

    e.mesh.scale.y=1+wob*.055;
    e.mesh.scale.x=1-wob*.026;
    e.mesh.scale.z=1+wob*.026;

    if(e.hitFlash>0){
      e.hitFlash-=dt;
      e.body.material.emissiveIntensity=.92;
    }else{
      e.body.material.emissiveIntensity=.34;
    }

    updateEnemyHpUI(e);

    if(dist<2.3){
      game.coreHp-=7;
      createCoreHitFlash();
      removeEnemy(e);
      enemies.splice(i,1);

      if(game.coreHp<=0){
        game.coreHp=0;
        endGame();
      }
    }
  }
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];

    p.life-=dt;
    p.mesh.position.addScaledVector(p.velocity,dt);

    let hit=false;

    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];

      if(flatDistance(p.mesh.position,e.mesh.position)<1.02){
        e.hp-=p.damage;
        e.hitFlash=.08;
        createImpactBurst(p.mesh.position,p.color);
        hit=true;

        if(e.hp<=0){
          removeEnemy(e);
          enemies.splice(j,1);
          game.kills++;
        }

        break;
      }
    }

    if(hit||p.life<=0){
      scene.remove(p.mesh);
      projectiles.splice(i,1);
    }
  }
}

function createImpactBurst(pos,color){
  const burst=new THREE.Mesh(
    impactGeo,
    new THREE.MeshBasicMaterial({
      color,
      transparent:true,
      opacity:.75
    })
  );

  burst.position.copy(pos);
  scene.add(burst);

  fxBursts.push({
    mesh:burst,
    kind:"puff",
    life:.18,
    maxLife:.18
  });
}

function updateFx(dt){
  for(let i=fxBursts.length-1;i>=0;i--){
    const fx=fxBursts[i];

    fx.life-=dt;

    const ratio=1-fx.life/fx.maxLife;

    if(fx.kind==="puff"){
      fx.mesh.scale.setScalar(1+ratio*2.5);
      fx.mesh.material.opacity=Math.max(0,.75*(1-ratio));
    }else if(fx.kind==="ring"){
      fx.mesh.scale.setScalar(1+ratio*4.2);
      fx.mesh.material.opacity=Math.max(0,.8*(1-ratio));
    }else if(fx.kind==="spark"){
      fx.mesh.position.y+=dt*.9;
      fx.mesh.scale.setScalar(1+ratio*1.8);
      fx.mesh.material.opacity=Math.max(0,.95*(1-ratio));
    }

    if(fx.life<=0){
      scene.remove(fx.mesh);
      fxBursts.splice(i,1);
    }
  }
}

function createCoreHitFlash(){
  game.coreLight.intensity=6.2;
  flashCoreDamageOverlay();

  setTimeout(()=>{
    if(game.coreLight){
      game.coreLight.intensity=2.4;
    }
  },120);
}

function flashCoreDamageOverlay(){
  if(!coreDamageOverlay)return;

  clearTimeout(coreDamageTimer);
  coreDamageOverlay.classList.remove("flash");
  void coreDamageOverlay.offsetWidth;
  coreDamageOverlay.classList.add("flash");

  coreDamageTimer=setTimeout(()=>{
    coreDamageOverlay.classList.remove("flash");
  },420);
}

function updateByuris(dt){
  for(let i=0;i<byuris.length;i++){
    const b=byuris[i];

    if(b.userData.mode==="bless"){
      updateByuriBlessing(b,dt,i);
    }else{
      updateByuriSupport(b,dt,i);
    }

    const model=b.userData.model;
    const vel=b.userData.velocity||new THREE.Vector3(0,0,1);

    b.rotation.y=yawForPlusZ(vel.x,vel.z);

    const t=game.elapsed+i*2.17;

    model.rotation.x=.28+Math.sin(t*2.1)*.08;
    model.rotation.y=Math.sin(t*1.3)*.26;
    model.rotation.z=Math.sin(t*2.7)*.14;
  }

  game.coreOrb.rotation.y+=dt*.8;
  game.coreOrb.position.y=1.42+Math.sin(game.elapsed*2.2)*.08;
}

function updateByuriSupport(b,dt,i){
  const t=game.elapsed;
  const baseA=b.userData.supportAngle;

  const wanderA=
    baseA+
    Math.sin(t*b.userData.speedA+b.userData.phase)*.36+
    Math.sin(t*.41+b.userData.phase*2.1)*.18;

  const radius=
    b.userData.supportRadius+
    Math.sin(t*b.userData.speedB+b.userData.phase)*.95+
    Math.sin(t*.73+i)*.35;

  const sideA=wanderA+Math.PI/2;
  const side=Math.sin(t*(b.userData.speedA*1.7)+b.userData.phase*1.3)*.55;

  const yWave=
    Math.sin(t*1.8+b.userData.phase)*.18+
    Math.sin(t*2.9+i*2.3)*.11+
    Math.sin(t*.67+b.userData.phase*3)*.09;

  const target=new THREE.Vector3(
    Math.cos(wanderA)*radius+Math.cos(sideA)*side,
    b.userData.supportHeight+yWave,
    -Math.sin(wanderA)*radius-Math.sin(sideA)*side
  );

  const prev=b.position.clone();

  b.position.lerp(target,Math.min(1,dt*6.8));

  const velocity=b.position.clone().sub(prev);

  if(velocity.lengthSq()>.000001){
    b.userData.velocity=velocity;
  }

  const s=b.userData.baseScale*(1+Math.sin(t*3.1+i)*.025);

  b.scale.setScalar(s);
}

function updateByuriBlessing(b,dt,i){
  const cannon=b.userData.blessCannon;

  if(!cannon){
    b.userData.mode="support";
    return;
  }

  const prev=b.position.clone();

  b.userData.blessTimer+=dt;
  b.userData.sparkTimer-=dt;

  const dur=b.userData.blessDuration;
  const t=b.userData.blessTimer/dur;
  const a=game.elapsed*13+b.userData.phase;
  const radius=.95*(1-Math.min(.45,t));
  const target=cannon.group.position.clone();

  target.x+=Math.cos(a)*radius;
  target.y=2.25+Math.sin(a*1.7)*.28;
  target.z+=Math.sin(a)*radius;

  b.position.lerp(target,Math.min(1,dt*10.5));

  const velocity=b.position.clone().sub(prev);

  if(velocity.lengthSq()>.000001){
    b.userData.velocity=velocity;
  }

  const pulseScale=b.userData.baseScale*(1.2+Math.sin(game.elapsed*12)*.09);

  b.scale.setScalar(pulseScale);

  if(b.userData.sparkTimer<=0){
    spawnBlessSpark(b.position,cannon.color);
    b.userData.sparkTimer=.12;
  }

  if(t>=1){
    b.userData.mode="support";
    b.userData.blessCannon=null;
    b.userData.blessTimer=0;
  }
}

function updateSpawning(dt){
  game.spawnTimer-=dt;

  const difficulty=Math.min(.82,game.elapsed*.0034);
  const interval=Math.max(.82,game.spawnBaseInterval-difficulty);

  if(game.spawnTimer<=0){
    spawnEnemy();

    if(game.elapsed>42&&Math.random()<.13){
      spawnEnemy();
    }

    if(game.elapsed>90&&Math.random()<.12){
      spawnEnemy();
    }

    game.spawnTimer=interval;
  }
}

function updateCamera(){
  const desiredYaw=clamp(state.targetYaw+state.dragYawOffset,-Math.PI/2,Math.PI/2);
  const diff=normalizeAngle(desiredYaw-state.yaw);

  state.yaw+=diff*.22;
  state.yaw=clamp(state.yaw,-Math.PI/2,Math.PI/2);

  camera.rotation.y=state.yaw;
  camera.rotation.x=state.pitch;
}

function renderMiniMap(){
  if(!miniCtx)return;

  const ctx=miniCtx;
  const w=miniMap.width;
  const h=miniMap.height;
  const cx=w*.5;
  const cy=h*.73;
  const radius=w*.43;

  function mapPoint(x,z){
    const dist=Math.sqrt(x*x+z*z);
    const angle=Math.atan2(z,x);
    const r=Math.min(dist,44)/44*radius;

    return{
      x:cx+Math.cos(angle)*r,
      y:cy+Math.sin(angle)*r
    };
  }

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#372d31";
  ctx.fillRect(0,0,w,h);

  ctx.save();
  ctx.globalAlpha=.52;
  ctx.fillStyle="#745348";
  ctx.beginPath();
  ctx.ellipse(cx,cy+10,w*.45,h*.22,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  directions.forEach((dir,index)=>{
    const a=degToRad(dir.degree);
    const near=mapPoint(Math.cos(a)*6,-Math.sin(a)*6);
    const far=mapPoint(Math.cos(a)*43,-Math.sin(a)*43);
    const active=index===state.viewIndex;

    ctx.strokeStyle=active?"rgba(126,216,202,.88)":"rgba(232,227,218,.24)";
    ctx.lineWidth=active?10:7;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(near.x,near.y);
    ctx.lineTo(far.x,far.y);
    ctx.stroke();

    ctx.strokeStyle="rgba(17,20,25,.48)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(near.x,near.y);
    ctx.lineTo(far.x,far.y);
    ctx.stroke();
  });

  byuris.forEach(b=>{
    const p=mapPoint(b.position.x,b.position.z);

    ctx.fillStyle="rgba(210,255,244,.92)";
    ctx.strokeStyle="#111419";
    ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y-4.2);
    ctx.lineTo(p.x+3.8,p.y+2.4);
    ctx.lineTo(p.x-3.8,p.y+2.4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  cannons.forEach((c,index)=>{
    const p=mapPoint(c.group.position.x,c.group.position.z);
    const active=index===state.viewIndex;
    const yaw=c.baseYaw;
    const bx=Math.cos(yaw)*9;
    const by=-Math.sin(yaw)*9;

    ctx.fillStyle="#0f1015";
    ctx.beginPath();
    ctx.arc(p.x,p.y,8.4,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=active?"#e8e3da":"#343640";
    ctx.beginPath();
    ctx.arc(p.x,p.y,6.2,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#0f1015";
    ctx.lineWidth=4.4;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x+bx,p.y+by);
    ctx.stroke();

    ctx.fillStyle="#"+c.color.toString(16).padStart(6,"0");
    ctx.beginPath();
    ctx.arc(p.x+bx,p.y+by,3,0,Math.PI*2);
    ctx.fill();
  });

  enemies.forEach(e=>{
    const p=mapPoint(e.mesh.position.x,e.mesh.position.z);
    const hp=clamp(e.hp/e.maxHp,0,1);

    ctx.fillStyle="rgba(20,14,17,.36)";
    ctx.beginPath();
    ctx.ellipse(p.x,p.y+5.4,8.2,3.2,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=e.hitFlash>0?"#bfffee":"#6dd0a5";
    ctx.strokeStyle="#111419";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p.x-7.2,p.y+3.2);
    ctx.quadraticCurveTo(p.x-7.8,p.y-5.8,p.x,p.y-8.5);
    ctx.quadraticCurveTo(p.x+7.8,p.y-5.8,p.x+7.2,p.y+3.2);
    ctx.quadraticCurveTo(p.x+4.6,p.y+7,p.x,p.y+6.2);
    ctx.quadraticCurveTo(p.x-4.6,p.y+7,p.x-7.2,p.y+3.2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#111419";
    ctx.beginPath();
    ctx.arc(p.x-2.6,p.y-1.3,1.2,0,Math.PI*2);
    ctx.arc(p.x+2.6,p.y-1.3,1.2,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111419";
    ctx.fillRect(p.x-8,p.y-12,16,3.6);
    ctx.fillStyle="#e98787";
    ctx.fillRect(p.x-7,p.y-11.2,14*hp,2);
  });

  ctx.fillStyle="#e8e3da";
  ctx.strokeStyle="#111419";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(cx,cy,10,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle=coreMeterFill.classList.contains("low")?"#e98787":"#7fe5d9";
  ctx.beginPath();
  ctx.arc(cx,cy,5.2,0,Math.PI*2);
  ctx.fill();
}

function renderCannonMiniStats(){
  if(!cannonMiniStats)return;

  const sideLabels=["좌","중","우"];

  cannonMiniStats.innerHTML=cannons.map((c,index)=>{
    const pct=clamp(c.energy/100,0,1);
    const active=index===state.viewIndex?" active":"";
    const side=sideLabels[index]||String(index+1);
    const color=c.color.toString(16).padStart(6,"0");

    return '<div class="hudCannonStat'+active+'">'+
      '<span class="hudCannonSide">'+side+'</span>'+
      '<span class="hudCannonLevel">Lv.'+c.level+'</span>'+
      '<span class="hudCannonDamage"><i class="swordIcon"></i>'+c.damage+'</span>'+
      '<span class="hudCannonBar"><i style="width:'+Math.round(pct*100)+'%;background:#'+color+'"></i></span>'+

  }).join("");
}
function updateHud(){
  const coreHp=Math.ceil(game.coreHp);
  const elapsed=Math.floor(game.elapsed);
  const corePct=clamp(game.coreHp/100,0,1);

  coreHpText.textContent=coreHp;
  killText.textContent=game.kills;
  timeText.textContent=elapsed;

  renderCannonMiniStats();

  levelText.textContent=cannons
    .map(c=>c.name+" Lv."+c.level)
    .join(" / ");

  lookText.textContent=getFacingClockLabel(state.yaw);

  coreMeterFill.style.width=(corePct*100)+"%";
  coreMeterFill.classList.toggle("low",corePct<.35);

  updatePanelHud(coreHp,elapsed);
  updatePauseButton();
}

function updatePanelHud(coreHp,elapsed){
  panelCoreText.textContent=coreHp;
  panelKillText.textContent=game.kills;
  panelTimeText.textContent=elapsed+"s";

  panelCannonList.innerHTML=cannons.map(c=>{
    const pct=clamp(c.energy,0,100);
    const color=formatHexColor(c.color);
    const tapLabel=(pct<28||!c.charged)?" TAP":"";

    return ''+
      '<div class="panelCannon">'+
        '<div class="panelCannonTop"><span><i class="panelDot" style="background:'+color+'"></i>'+c.name+'</span><span>Lv.'+c.level+tapLabel+'</span></div>'+
        '<div class="panelBar"><div class="panelFill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
      '</div>';
  }).join("");

  const nearest=getNearestEnemy();

  panelEnemyText.textContent=enemies.length?enemies.length:"CLEAR";
  panelEnemyInfo.textContent=nearest
    ?"INCOMING HP "+Math.ceil(nearest.hp)+" / "+nearest.maxHp
    :"NO SLIME";
}

function getNearestEnemy(){
  let nearest=null;
  let bestDist=Infinity;

  for(const enemy of enemies){
    const dist=flatDistance(enemy.mesh.position,{x:0,z:0});

    if(dist<bestDist){
      bestDist=dist;
      nearest=enemy;
    }
  }

  return nearest;
}

function formatHexColor(value){
  return "#"+value.toString(16).padStart(6,"0");
}

function getFacingClockLabel(yaw){
  const worldA=yawToWorldAngle(yaw);
  const degrees=(worldA*180/Math.PI+360)%360;

  const dirData=[
    {name:"9시 부근",degree:180},
    {name:"10시 부근",degree:150},
    {name:"12시 부근",degree:90},
    {name:"2시 부근",degree:30},
    {name:"3시 부근",degree:0}
  ];

  let best=dirData[0];
  let bestDiff=9999;

  for(const d of dirData){
    const diff=Math.abs(shortestDegreeDiff(degrees,d.degree));

    if(diff<bestDiff){
      bestDiff=diff;
      best=d;
    }
  }

  return best.name;
}

function resetGame(){
  for(const e of enemies){
    removeEnemy(e);
  }

  enemies.length=0;

  for(const p of projectiles){
    scene.remove(p.mesh);
  }

  projectiles.length=0;

  for(const fx of fxBursts){
    scene.remove(fx.mesh);
  }

  fxBursts.length=0;

  game.coreHp=100;
  game.kills=0;
  game.elapsed=0;
  game.spawnTimer=1.2;
  game.gameOver=false;
  game.paused=false;
  game.debugPaused=false;
  game.pendingUpgradeCannon=null;

  gameOverEl.style.display="none";
  upgradeWindow.style.display="none";

  closeStatus();
  setViewIndex(1);
  state.yaw=state.targetYaw;
  state.dragYawOffset=0;
  updatePauseButton();

  cannons.forEach(c=>{
    c.level=1;
    c.correctCount=0;
    c.energy=100;
    c.charged=true;
    c.damage=17;
    c.cooldown=.56;
    c.fireTimer=Math.random()*.25;
    c.range=42;
    c.glow.intensity=1.45;
    c.backCrystal.scale.set(1,.9,1);
    c.doubleShotChance=0;
    c.burstEnabled=false;
    c.burstInterval=8;
    c.burstTimer=4+Math.random()*2;
  });

  byuris.forEach(b=>{
    b.userData.mode="support";
    b.userData.blessCannon=null;
    b.userData.blessTimer=0;
    b.userData.sparkTimer=0;
    b.userData.phase=Math.random()*Math.PI*2;
  });

  updateHud();
}

function endGame(){
  game.gameOver=true;
  game.paused=false;
  game.debugPaused=false;
  updatePauseButton();
  gameOverEl.style.display="grid";
}

function animate(){
  requestAnimationFrame(animate);

  const rawDt=Math.min(clock.getDelta(),.04);

  if(!game.gameOver&&!game.paused&&!game.debugPaused){
    const dt=rawDt;

    game.elapsed+=dt;

    updateSpawning(dt);
    updateEnemies(dt);
    updateCannonEnergy(dt);
    updateCannons(dt);
    updateProjectiles(dt);
    updateFx(dt);
    updateByuris(dt);
    updateCamera();
    updateHud();
  }else{
    updateCamera();
    cannons.forEach(updateEnergyUI);
    updateHud();
  }

  renderMiniMap();
  renderer.render(scene,camera);
}

function angleForXBarrel(dx,dz){
  return Math.atan2(-dz,dx);
}

function yawForPlusZ(dx,dz){
  return Math.atan2(dx,dz);
}

function yawToWorldAngle(yaw){
  const forwardX=-Math.sin(yaw);
  const forwardZ=-Math.cos(yaw);

  return Math.atan2(-forwardZ,forwardX);
}

function shortestDegreeDiff(a,b){
  let d=a-b;

  while(d>180)d-=360;
  while(d<-180)d+=360;

  return d;
}

function flatDistance(a,b){
  const dx=a.x-b.x;
  const dz=a.z-b.z;

  return Math.sqrt(dx*dx+dz*dz);
}

function normalizeAngle(a){
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;

  return a;
}

function degToRad(deg){
  return deg*Math.PI/180;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function randFloat(min,max){
  return Math.random()*(max-min)+min;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=randInt(0,i);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }

  return arr;
}
