<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BYURI TEST Frontpage</title>
<style>
:root{--ink:#171a1f;--panel:#2d3438;--panel2:#3a4247;--line:rgba(244,241,234,.68);--cream:#f4f1ea;--mint:#7fe5d9;--coral:#df7e83;--dust:#a58370;--blue:#516a82;--shadow:rgba(6,8,10,.44)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#2f383d 0%,#51474b 58%,#2a282e 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cream)}
body{display:flex;justify-content:center;align-items:stretch;padding:0;overflow:hidden}
button,select{font:inherit;color:inherit}
.app{position:relative;width:min(100vw,430px);height:100vh;height:100svh;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 5%,rgba(127,229,217,.18),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0));overflow:hidden}
.app::before{content:"";position:absolute;inset:6px;border:3px solid rgba(244,241,234,.55);border-radius:24px;box-shadow:inset 0 0 0 3px rgba(18,21,26,.54),0 18px 42px var(--shadow);pointer-events:none}
.topbar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px 0}
.kicker{font-size:11px;font-weight:950;letter-spacing:.08em;color:var(--mint)}
h1{margin:1px 0 0;font-size:22px;line-height:1;font-weight:1000;letter-spacing:0;color:var(--cream);text-shadow:0 3px 0 rgba(0,0,0,.32)}
.ghostLink{display:grid;place-items:center;min-width:46px;height:34px;padding:0 10px;border-radius:8px;border:2px solid rgba(244,241,234,.58);background:rgba(23,26,31,.35);text-decoration:none;color:var(--cream);font-size:12px;font-weight:950;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.content{position:relative;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) auto;gap:8px;min-height:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{min-height:50px;padding:7px 7px 6px;border-radius:9px;border:2px solid rgba(244,241,234,.62);background:rgba(45,52,56,.78);box-shadow:0 4px 0 rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.12)}
.stat span{display:block;color:rgba(244,241,234,.72);font-size:9px;font-weight:950;text-transform:uppercase}
.stat b{display:block;margin-top:3px;color:#fff;font-size:14px;font-weight:1000;line-height:1.05}
.panel{min-height:0;padding:8px;border-radius:12px;border:2px solid rgba(244,241,234,.66);background:rgba(45,52,56,.82);box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden}
.panelHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.panelTitle{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;font-weight:1000;color:#fff}
.badge{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:2px solid #171a1f;background:linear-gradient(180deg,#f5f1e8,#d8efe8);color:#171a1f;box-shadow:0 2px 0 rgba(0,0,0,.4);font-size:13px;font-weight:1000}
.panelTools{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.toolBtn{height:26px;padding:0 8px;border:2px solid rgba(244,241,234,.62);border-radius:7px;background:rgba(23,26,31,.42);box-shadow:0 2px 0 rgba(0,0,0,.35);font-size:10px;font-weight:950}
.switch{position:relative;display:inline-grid;place-items:center;width:44px;height:26px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch span{width:44px;height:26px;border-radius:999px;border:2px solid rgba(244,241,234,.62);background:rgba(22,25,30,.68);box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.switch span::after{content:"";position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--cream);box-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .12s ease,background .12s ease}
.switch input:checked+span{background:rgba(127,229,217,.45);border-color:rgba(127,229,217,.9)}
.switch input:checked+span::after{transform:translateX(18px);background:#fff}
.scrollPane{height:calc(100% - 38px);overflow:auto;padding-right:2px;scrollbar-width:thin}
.unitGroup{padding:6px 0;border-top:1px solid rgba(244,241,234,.16)}
.unitGroup:first-child{border-top:0;padding-top:0}
.unitTitle{margin-bottom:5px;color:rgba(244,241,234,.72);font-size:10px;font-weight:950}
.chipGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.chipGrid.units{grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{min-height:30px;padding:0 5px;border-radius:8px;border:2px solid rgba(244,241,234,.46);background:rgba(23,26,31,.34);color:rgba(244,241,234,.8);box-shadow:0 2px 0 rgba(0,0,0,.34);font-size:10px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.active{border-color:#171a1f;background:linear-gradient(180deg,#f5f1e8,#ccebe5);color:#171a1f;box-shadow:0 3px 0 rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.8)}
.wordTop{display:grid;grid-template-columns:86px 1fr;gap:7px;margin-bottom:7px}
.selectBox{height:58px;display:grid;gap:4px;padding:6px;border-radius:9px;border:2px solid rgba(244,241,234,.54);background:rgba(23,26,31,.32)}
.selectBox label,.modeBox span{font-size:9px;font-weight:950;color:rgba(244,241,234,.7);text-transform:uppercase}
select{width:100%;height:26px;border:2px solid rgba(244,241,234,.62);border-radius:7px;background:#f4f1ea;color:#171a1f;font-size:12px;font-weight:1000;outline:none}
.modeBox{height:58px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.modeToggle{position:relative;display:grid;place-items:center;border-radius:9px;border:2px solid rgba(244,241,234,.52);background:rgba(23,26,31,.32);box-shadow:0 2px 0 rgba(0,0,0,.34);overflow:hidden}
.modeToggle input{position:absolute;opacity:0}
.modeToggle b{position:relative;z-index:1;font-size:11px;font-weight:1000}
.modeToggle span{position:relative;z-index:1;margin-top:-3px}
.modeToggle input:checked~b,.modeToggle input:checked~span{color:#171a1f}
.modeToggle input:checked~i{position:absolute;inset:0;background:linear-gradient(180deg,#f5f1e8,#d9efe8)}
.dayPane{height:calc(100% - 104px);min-height:70px;overflow:auto;padding-right:2px}
.compose{display:grid;grid-template-columns:1fr 124px;gap:8px;min-height:108px}
.preview{display:grid;align-content:start;gap:5px;min-height:0;overflow:auto}
.previewLine{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:25px;padding:0 7px;border-radius:7px;border:1px solid rgba(244,241,234,.24);background:rgba(23,26,31,.24);font-size:10px;font-weight:950;color:rgba(244,241,234,.78)}
.previewLine b{color:#fff;font-size:10px;text-align:right}
.startStack{display:grid;gap:6px;align-content:stretch}
.startBtn{border:3px solid #171a1f;border-radius:10px;background:linear-gradient(180deg,#7fe5d9,#56bcb1);color:#171a1f;box-shadow:0 5px 0 rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.6);font-size:15px;font-weight:1000}
.startBtn.secondary{background:linear-gradient(180deg,#f5f1e8,#d8d4cb);font-size:12px}
.emptyNote{padding:10px;border-radius:8px;border:1px solid rgba(244,241,234,.24);color:rgba(244,241,234,.7);font-size:11px;font-weight:900;text-align:center}
.footer{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;padding:0 4px;color:rgba(244,241,234,.58);font-size:10px;font-weight:900}
@media(min-width:760px){body{align-items:center}.app{height:min(100vh,720px);border-radius:26px}.app::after{content:"";position:absolute;left:calc(100% + 18px);top:66px;width:180px;height:330px;border:2px solid rgba(244,241,234,.36);border-radius:16px;background:rgba(45,52,56,.36);box-shadow:0 8px 24px rgba(0,0,0,.22)}}
@media(max-width:370px){.app{padding:10px 10px max(10px,env(safe-area-inset-bottom));gap:6px}.content{gap:6px}.panel{padding:7px}.chipGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.chipGrid.units{grid-template-columns:repeat(2,minmax(0,1fr))}.dayPane{height:calc(100% - 100px);min-height:62px}.compose{grid-template-columns:1fr 112px}.startBtn{font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="kicker">BYURI TEST</div>
      <h1>Question Loadout</h1>
    </div>
    <a class="ghostLink" href="BYURI_TEST_3D.html">3D</a>
  </header>

  <main class="content">
    <section class="summary" aria-label="Current setup summary">
      <div class="stat"><span>Aisth</span><b id="aisthCount">0 Q</b></div>
      <div class="stat"><span>Words</span><b id="wordCount">0 W</b></div>
      <div class="stat"><span>Mix</span><b id="poolCount">0 pools</b></div>
    </section>

    <section class="panel">
      <div class="panelHeader">
        <div class="panelTitle"><span class="badge">A</span><span>Aisth Grammar</span></div>
        <div class="panelTools">
          <button id="selectAllUnits" class="toolBtn" type="button">ALL</button>
          <button id="clearUnits" class="toolBtn" type="button">OFF</button>
          <label class="switch"><input id="aisthEnabled" type="checkbox" checked><span></span></label>
        </div>
      </div>
      <div id="aisthUnits" class="scrollPane"></div>
    </section>

    <section class="panel">
      <div class="panelHeader">
        <div class="panelTitle"><span class="badge">W</span><span>Word Sets</span></div>
        <div class="panelTools">
          <button id="selectAllDays" class="toolBtn" type="button">ALL</button>
          <button id="clearDays" class="toolBtn" type="button">OFF</button>
        </div>
      </div>
      <div class="wordTop">
        <div class="selectBox">
          <label for="wordLevel">Level</label>
          <select id="wordLevel"></select>
        </div>
        <div class="modeBox">
          <label class="modeToggle"><input id="wordChoiceEnabled" type="checkbox"><i></i><b>Choice</b><span>meaning</span></label>
          <label class="modeToggle"><input id="wordScrambleEnabled" type="checkbox"><i></i><b>Scramble</b><span>spell</span></label>
        </div>
      </div>
      <div id="wordDays" class="chipGrid dayPane"></div>
    </section>

    <section class="panel compose">
      <div>
        <div class="panelHeader">
          <div class="panelTitle"><span class="badge">M</span><span>Mission Mix</span></div>
        </div>
        <div id="configPreview" class="preview"></div>
      </div>
      <div class="startStack">
        <button id="start3d" class="startBtn" type="button">START 3D</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="wordModeText">OFF</span>
    <span id="dayText">No day</span>
  </footer>
</div>

<script src="js/aisth-question-set.js"></script>
<script src="js/byuri-word-set.js"></script>
<script src="js/byuri-frontpage.js"></script>
</body>
</html>
