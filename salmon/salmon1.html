<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salmon1</title>
<style>
  :root{
    --panel:#121821;
    --card:#151d28;
    --muted:#7b8a9a;
    --text:#e7edf5;
    --accent:#8fd3ff;
    --ok:#5dd39e;
    --warn:#ff9d76;
    --yellow:#ffd54d;
    --purple:#a78bfa;
    --br:16px;
    --shadow:0 10px 30px rgba(0,0,0,.25);
    --gap:14px;
  }

  *{box-sizing:border-box}

  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
  }

  body{
    background:
      radial-gradient(circle at 20% 20%, rgba(143,211,255,.08), transparent 28%),
      radial-gradient(circle at 80% 70%, rgba(167,139,250,.08), transparent 32%),
      linear-gradient(120deg,#0a1017,#0b1220 50%,#0a1017);
    color:var(--text);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Malgun Gothic,Helvetica,Arial,sans-serif;
  }

  select{
    font:inherit;
  }

  body.front-mode .wrap{
    display:none;
  }

  body.quiz-mode .front-page{
    display:none;
  }

  .front-page{
    width:100%;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .front-frame{
    width:min(1120px,96vw);
    height:min(840px,92vh);
    border-radius:14px;
    border:1px solid rgba(143,211,255,.18);
    box-shadow:0 12px 26px rgba(0,0,0,.18);
    background:#0a1017;
    position:relative;
    overflow:hidden;
  }

  .front-inner{
    position:absolute;
    inset:12px;
    border-radius:14px;
    overflow:hidden;
    background:
      radial-gradient(circle at 18% 14%, rgba(143,211,255,.18), transparent 30%),
      radial-gradient(circle at 84% 78%, rgba(167,139,250,.16), transparent 34%),
      linear-gradient(135deg,#0a1017,#0b1220 54%,#0a1017);
    color:var(--text);
    padding:clamp(28px,4vw,52px);
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(360px,420px);
    align-items:center;
    gap:clamp(28px,5vw,72px);
  }

  .front-title{
    margin:0;
    color:var(--yellow);
    font-size:clamp(34px,6vw,72px);
    line-height:1.1;
    font-weight:850;
    letter-spacing:0;
  }

  .front-head{
    display:block;
    flex:0 0 auto;
  }

  .front-sub{
    margin-top:10px;
    color:var(--accent);
    font-size:clamp(15px,2.2vw,22px);
    font-weight:800;
  }

  .front-panel{
    width:min(420px,100%);
    justify-self:end;
    background:var(--panel);
    border:1px solid #26374d;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px;
    display:grid;
    gap:12px;
  }

  .front-label{
    display:block;
    color:var(--muted);
    font-size:13px;
    font-weight:800;
  }

  #frontDaySelect{
    width:100%;
    height:46px;
    margin-top:7px;
    border:1px solid #31445c;
    border-radius:12px;
    padding:0 12px;
    background:#0b111a;
    color:var(--text);
    outline:none;
    font-size:16px;
    font-weight:750;
  }

  #frontDaySelect:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(143,211,255,.12);
  }

  .front-actions{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }

  .front-btn{
    height:44px;
    border:1px solid #2f5f7d;
    border-radius:12px;
    background:#102236;
    color:#cfeeff;
    cursor:pointer;
    font-weight:850;
  }

  .front-btn.primary{
    border-color:#6f5db7;
    background:#17122a;
    color:#ddd6fe;
  }

  .front-btn:disabled{
    opacity:.58;
    cursor:not-allowed;
  }

  .front-status{
    min-height:20px;
    color:var(--warn);
    font-size:12px;
    font-weight:700;
    line-height:1.45;
  }

  .front-foot{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
  }

  .wrap{
    width:100%;
    height:100dvh;
    max-width:1200px;
    margin:0 auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  header{
    flex:0 0 38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .title{
    font-size:21px;
    font-weight:850;
    letter-spacing:0;
    color:var(--yellow);
    text-shadow:0 0 14px rgba(255,213,77,.35);
  }

  .progress{
    font-weight:800;
    color:#ffeaa0;
    font-size:14px;
    white-space:nowrap;
    padding:4px 9px;
    border:1px solid rgba(255,213,77,.28);
    border-radius:999px;
    background:rgba(255,213,77,.08);
    box-shadow:0 0 14px rgba(255,213,77,.12);
  }

  .grid{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);
    gap:var(--gap);
  }

  .panel{
    min-height:0;
    background:var(--panel);
    border-radius:var(--br);
    box-shadow:var(--shadow);
    padding:14px;
    overflow:hidden;
  }

  .left-panel{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .top-row{
    flex:0 0 auto;
    min-height:36px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }

  .controls{
    display:flex;
    gap:8px;
    align-items:center;
  }

  .btn{
    appearance:none;
    border:1px solid #223042;
    background:#101722;
    color:var(--text);
    padding:7px 11px;
    border-radius:10px;
    font-weight:750;
    cursor:pointer;
    white-space:nowrap;
  }

  .btn:hover{border-color:#2f4157}

  .btn.primary{
    border-color:#2f5f7d;
    background:#102236;
    color:#cfeeff;
  }

  .btn.ok{
    border-color:#226046;
    background:#0e2018;
    color:#baf5d8;
  }

  .btn.submit{
    border-color:#6f5db7;
    background:#17122a;
    color:#ddd6fe;
  }

  .btn:disabled{
    opacity:.58;
    cursor:not-allowed;
  }

  .mobile-bank-toggle{
    display:none;
  }

  #openDictBtn{
    display:none;
  }

  body.answer-open #openDictBtn{
    display:inline-block;
  }

  .toast{
    color:var(--warn);
    font-size:13px;
    min-width:100px;
    text-align:right;
  }

  .dict-panel{
    flex:0 0 0;
    height:0;
    overflow:hidden;
    background:#0f1621;
    border:0 solid #26374d;
    border-radius:14px;
    transition:height .2s ease, flex-basis .2s ease, border-width .2s ease;
  }

  .dict-panel.open{
    flex:0 0 250px;
    height:250px;
    border-width:1px;
  }

  .dict-head{
    height:32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    border-bottom:1px solid #26374d;
    color:#cfeeff;
    font-size:13px;
    font-weight:800;
  }

  .dict-close{
    border:0;
    background:transparent;
    color:#cfeeff;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    padding:0 4px;
  }

  #dictFrame{
    width:100%;
    height:calc(100% - 32px);
    border:0;
    display:block;
    background:white;
  }

  .card{
    flex:0 0 145px;
    height:145px;
    background:var(--card);
    border:2px solid var(--yellow);
    border-radius:14px;
    padding:16px;
    position:relative;
    display:flex;
    align-items:center;
    box-shadow:
      0 0 0 2px rgba(255,213,77,.15) inset,
      0 0 16px rgba(255,213,77,.35),
      0 0 40px rgba(255,213,77,.2);
  }

  .card .status{
    position:absolute;
    right:10px;
    top:8px;
    font-size:12px;
    color:var(--muted);
  }

  .card .question-no{
    position:absolute;
    left:10px;
    top:8px;
    padding:2px 8px;
    border:1px solid rgba(255,213,77,.48);
    border-radius:999px;
    background:rgba(255,213,77,.08);
    color:#ffeaa0;
    box-shadow:
      0 0 0 1px rgba(255,213,77,.08) inset,
      0 0 12px rgba(255,213,77,.16);
    font-size:12px;
    font-weight:900;
    line-height:1.2;
    letter-spacing:0;
  }

  .tap-hint{
    display:none;
    position:absolute;
    left:50%;
    top:7px;
    transform:translateX(-50%);
    padding:2px 10px 3px;
    border:1px solid rgba(255,213,77,.9);
    border-radius:999px;
    background:linear-gradient(180deg,#fff1a8,#ffd54d);
    color:#4a3700;
    box-shadow:
      0 2px 0 rgba(111,82,0,.38),
      0 0 16px rgba(255,213,77,.42);
    font-size:12px;
    font-weight:950;
    line-height:1.2;
    pointer-events:none;
    z-index:3;
  }

  .card[data-tap-hint="true"] .tap-hint{
    display:block;
    animation:tapBounce .72s ease-in-out infinite;
  }

  .card[data-solved="true"]{
    box-shadow:
      0 0 0 2px rgba(93,211,158,.18) inset,
      0 0 18px rgba(93,211,158,.35),
      0 0 44px rgba(93,211,158,.18);
  }

  .card[data-solved="true"] .status{color:var(--ok)}

  .card.hit-pulse{
    animation:cardHitPulse .34s ease both;
  }

  .tokens{
    width:100%;
    line-height:1.9;
    word-wrap:anywhere;
    font-size:20px;
    color:var(--yellow);
  }

  .token{
    padding:2px 4px;
    --token-radius:8px;
    --source-fade-inset:4px;
    border-radius:var(--token-radius);
    cursor:pointer;
    transition:background .18s,transform .1s,color .18s;
    display:inline-block;
    position:relative;
    overflow:visible;
    margin:0 1px;
  }

  .token:hover{background:#1a2533}

  .token[data-found="true"]{
    background:rgba(93,211,158,.18);
    color:#d6ffe9;
    box-shadow:
      0 0 0 1px rgba(93,211,158,.24) inset,
      0 0 12px rgba(93,211,158,.22);
  }

  .token[data-affected-visible="true"]{
    background:linear-gradient(180deg, rgba(93,211,158,.08), rgba(93,211,158,.04));
    color:#dcffed;
    border-radius:0;
    box-shadow:
      0 -2px 0 rgba(93,211,158,.86) inset,
      0 2px 0 rgba(93,211,158,.86) inset,
      0 0 13px rgba(93,211,158,.28);
  }

  .token[data-affected-visible="true"]::after{
    content:"";
    position:absolute;
    left:100%;
    top:0;
    bottom:0;
    width:.5em;
    background:rgba(93,211,158,.04);
    box-shadow:
      0 -2px 0 rgba(93,211,158,.86) inset,
      0 2px 0 rgba(93,211,158,.86) inset;
    pointer-events:none;
  }

  .token[data-affected-visible="true"][data-lasso-edge="end"]::after,
  .token[data-affected-visible="true"][data-lasso-edge="single"]::after{
    display:none;
  }

  .token[data-affected-visible="true"][data-lasso-edge="end"]::before,
  .token[data-affected-visible="true"][data-lasso-edge="single"]::before{
    content:"";
    position:absolute;
    right:-1px;
    top:1px;
    bottom:1px;
    width:2px;
    border-radius:999px;
    background:rgba(93,211,158,.95);
    box-shadow:0 0 14px rgba(93,211,158,.55);
    pointer-events:none;
  }

  .token[data-source-fade="true"]::after{
    content:"";
    position:absolute;
    left:calc(100% - 1px);
    top:var(--source-fade-inset);
    bottom:var(--source-fade-inset);
    width:18px;
    border-radius:0;
    background:linear-gradient(90deg, rgba(93,211,158,.38), rgba(93,211,158,.16) 42%, transparent);
    pointer-events:none;
    animation:sourceGlow .45s ease both;
    z-index:0;
  }

  .token.affected-reveal{
    animation:affectedReveal .42s ease both;
  }

  .token[data-found="true"][data-affected-visible="true"]{
    box-shadow:
      0 -2px 0 rgba(93,211,158,.95) inset,
      0 2px 0 rgba(93,211,158,.95) inset,
      0 0 0 1px rgba(93,211,158,.24) inset,
      0 0 16px rgba(93,211,158,.34);
  }

  .token.wrong{
    background:rgba(255,107,107,.16);
    transform:translateY(-1px);
  }

  .shake{animation:shake .3s}

  @keyframes shake{
    10%,90%{transform:translateX(-1px)}
    20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)}
    40%,60%{transform:translateX(4px)}
  }

  @keyframes affectedReveal{
    0%{
      background:rgba(93,211,158,0);
      box-shadow:
        0 0 0 rgba(93,211,158,0),
        0 0 0 rgba(93,211,158,0) inset;
      transform:translateY(0);
    }
    45%{
      background:rgba(93,211,158,.14);
      box-shadow:
        0 -2px 0 rgba(93,211,158,1) inset,
        0 2px 0 rgba(93,211,158,1) inset,
        0 0 18px rgba(93,211,158,.56);
      transform:translateY(-1px);
    }
    100%{
      background:rgba(93,211,158,.08);
      box-shadow:
        0 -2px 0 rgba(93,211,158,.86) inset,
        0 2px 0 rgba(93,211,158,.86) inset,
        0 0 13px rgba(93,211,158,.28);
      transform:translateY(0);
    }
  }

  @keyframes sourceGlow{
    0%{opacity:0; width:0}
    100%{opacity:1; width:18px}
  }

  @keyframes cardHitPulse{
    0%,100%{
      box-shadow:
        0 0 0 2px rgba(255,213,77,.15) inset,
        0 0 16px rgba(255,213,77,.35),
        0 0 40px rgba(255,213,77,.2);
    }
    45%{
      box-shadow:
        0 0 0 2px rgba(255,213,77,.42) inset,
        0 0 24px rgba(255,213,77,.78),
        0 0 64px rgba(255,213,77,.44);
    }
  }

  @keyframes tapBounce{
    0%,100%{transform:translate(-50%,0)}
    45%{transform:translate(-50%,-7px)}
  }

  .mini-card{
    flex:0 0 50px;
    width:100%;
    height:50px;
    background:#101722;
    border:1px solid var(--purple);
    border-radius:12px;
    padding:7px 88px 7px 11px;
    overflow:hidden;
    box-shadow:
      0 0 10px rgba(167,139,250,.18) inset,
      0 0 16px rgba(167,139,250,.22);
  }

  .mini-card .head{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:850;
    color:#c4b5fd;
    font-size:14px;
    line-height:1.2;
    margin-bottom:2px;
  }

  .mini-card .desc{
    font-size:13px;
    color:#e7edf5;
    line-height:1.25;
  }

  .mini-card .tag{
    font-size:11px;
    color:#c4b5fd;
    border:1px solid var(--purple);
    border-radius:8px;
    padding:0 6px;
  }

  .student-box{
    flex:0 0 72px;
    height:72px;
    background:#0f1621;
    border:1px solid rgba(143,211,255,.32);
    border-radius:14px;
    padding:9px;
    display:none;
    box-shadow:
      0 0 0 1px rgba(143,211,255,.08) inset,
      0 0 18px rgba(143,211,255,.14);
  }

  .student-box.save-pulse{
    animation:savePulse .34s ease both;
  }

  body.answer-open .student-box{
    display:block;
  }

  .student-row{
    display:flex;
    gap:8px;
    align-items:stretch;
  }

  textarea{
    flex:0 0 430px;
    width:430px;
    height:42px;
    min-height:42px;
    max-height:42px;
    resize:none;
    border:1px solid rgba(143,211,255,.52);
    background:linear-gradient(180deg,#07111d,#0b1623);
    color:var(--text);
    border-radius:12px;
    padding:6px 9px;
    font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Malgun Gothic,Helvetica,Arial,sans-serif;
    outline:none;
    box-shadow:
      0 0 0 1px rgba(143,211,255,.08) inset,
      0 0 16px rgba(143,211,255,.16);
  }

  textarea:focus{
    border-color:var(--accent);
    box-shadow:
      0 0 0 3px rgba(143,211,255,.14),
      0 0 22px rgba(143,211,255,.24);
  }

  .save-wrap{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:72px;
  }

  .save-wrap .btn{
    height:42px;
    border-color:#34d399;
    background:linear-gradient(180deg,#123427,#0e2018);
    color:#d7ffe9;
    box-shadow:
      0 2px 0 rgba(4,120,87,.55),
      0 0 18px rgba(93,211,158,.22);
    font-weight:900;
  }

  .saved-state{
    padding:4px 7px;
    border:1px solid rgba(255,157,118,.42);
    border-radius:999px;
    background:rgba(255,107,107,.1);
    color:#ffd1bf;
    box-shadow:
      0 0 0 1px rgba(255,157,118,.08) inset,
      0 0 14px rgba(255,107,107,.18);
    font-size:11px;
    font-weight:850;
    text-align:center;
    line-height:1.15;
    white-space:nowrap;
  }

  .saved-state[data-state="saved"]{
    border-color:rgba(93,211,158,.5);
    background:rgba(93,211,158,.12);
    color:#c7fbe0;
    box-shadow:
      0 0 0 1px rgba(93,211,158,.1) inset,
      0 0 16px rgba(93,211,158,.26);
  }

  .saved-state[data-state="dirty"]{
    border-color:rgba(255,213,77,.5);
    background:rgba(255,213,77,.1);
    color:#ffeaa0;
    box-shadow:
      0 0 0 1px rgba(255,213,77,.1) inset,
      0 0 15px rgba(255,157,118,.22);
  }

  @keyframes savePulse{
    0%,100%{
      box-shadow:
        0 0 0 1px rgba(143,211,255,.08) inset,
        0 0 18px rgba(143,211,255,.14);
    }
    45%{
      border-color:#5dd39e;
      box-shadow:
        0 0 0 1px rgba(93,211,158,.38) inset,
        0 0 28px rgba(93,211,158,.46),
        0 0 52px rgba(93,211,158,.22);
    }
  }

  .bank{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
  }

  .bank[data-selected="true"]{
    align-self:start;
    justify-self:stretch;
    width:100%;
  }

  .bank-head{
    flex:0 0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }

  .bank-head h2{
    margin:0;
    font-size:16px;
  }

  .bank #glossArea{
    flex:0 0 auto;
    width:100%;
    min-width:0;
    min-height:0;
  }

  .bank #glossArea:empty{
    display:none;
  }

  .gloss-choice{
    position:relative;
    display:block;
    width:100%;
    min-width:0;
  }

  .reselect-btn{
    position:absolute;
    top:8px;
    right:8px;
    min-width:64px;
    height:28px;
    padding:3px 9px;
    border:1px solid #c4b5fd;
    border-radius:999px;
    background:linear-gradient(#f4efff,#ddd6fe);
    color:#4c1d95;
    box-shadow:
      0 2px 0 rgba(76,29,149,.28),
      0 6px 12px rgba(0,0,0,.16),
      0 1px 0 rgba(255,255,255,.85) inset;
    font-size:12px;
    font-weight:900;
    line-height:1;
  }

  .bank-close{
    display:none;
    border:0;
    background:transparent;
    color:#cfeeff;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    padding:0 4px;
  }

  ul.bank-list{
    flex:1 1 auto;
    min-height:0;
    overflow:auto;
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:7px;
    align-content:start;
    -webkit-overflow-scrolling:touch;
  }

  .bank[data-selected="true"] ul.bank-list{
    display:none;
  }

  .bank-item{
    display:flex;
    min-width:0;
  }

  .bank-item.wide{
    grid-column:1 / -1;
  }

  .bank-item button{
    flex:1;
    min-width:0;
    text-align:left;
    border:1px solid #243347;
    background:#0f1621;
    color:var(--text);
    border-radius:10px;
    padding:8px 9px;
    cursor:pointer;
    font-weight:750;
    font-size:13px;
    line-height:1.25;
  }

  .bank-item button small{
    color:var(--muted);
    font-size:12px;
    font-weight:650;
  }

  .bank-item button.active{
    outline:2px solid var(--accent);
  }

  .bank-item button.used{
    background:#0e1b15;
    border-color:#1f4836;
    color:#a7e7c9;
  }

  .mobile-bank-backdrop{
    display:none;
  }

  @media (max-width:980px){
    html,body{
      overflow:auto;
    }

    .wrap{
      height:auto;
      min-height:100dvh;
    }

    .grid{
      grid-template-columns:1fr;

    textarea{

    }

    .controls .btn{

</head>
<body class="front-mode">
  <div class="front-page" id="frontPage">
    <main class="front-frame">
      <div class="front-inner">
        <header class="front-head">
          <h1 class="front-title">Salmon1</h1>
          <div class="front-sub">Collocations</div>
        </header>

        <section class="front-panel">
          <label class="front-label" for="frontDaySelect">
            Day
            <select id="frontDaySelect">
              <option value="">Loading...</option>
            </select>
          </label>

          <div class="front-actions">
            <button class="front-btn primary" id="frontStartBtn" type="button" disabled>Start</button>
            <button class="front-btn" id="frontReloadBtn" type="button">Reload</button>
          </div>

          <div class="front-status" id="frontStatus" aria-live="polite"></div>
        </section>

        <div class="front-foot" id="frontRouteInfo"></div>
      </div>
    </main>
  </div>

  <div class="wrap">
    <header>
      <div class="title">Salmon1</div>
      <div class="progress" id="progress">Day</div>
    </header>

    <main class="grid">
      <section class="panel left-panel">
        <div class="top-row">
          <div class="controls">
            <button class="btn" id="prevBtn" type="button">이전</button>
            <button class="btn" id="nextBtn" type="button">다음</button>
            <button class="btn primary" id="openDictBtn" type="button">영영사전</button>
            <button class="btn primary mobile-bank-toggle" id="mobileBankBtn" type="button">Bank</button>
          </div>
          <span class="toast" id="toast" aria-live="polite"></span>
        </div>

        <div class="dict-panel" id="dictPanel">
          <div class="dict-head">
            <span>네이버 영영사전</span>
            <button class="dict-close" id="closeDictBtn" type="button">×</button>
          </div>
          <iframe
            id="dictFrame"
            title="Naver English Dictionary"
            src="about:blank"
          ></iframe>
        </div>

        <div class="card" id="card" data-solved="false">
          <div class="question-no" id="questionNo">Q 1/20</div>
          <div class="tap-hint" id="tapHint">tap!</div>
          <div class="status" id="status">0/0</div>
          <div class="tokens" id="tokens"></div>
        </div>

        <div class="student-box">
          <div class="student-row">
            <textarea id="studentAnswer" placeholder="직접 입력"></textarea>
            <div class="save-wrap">
              <button class="btn ok" id="saveBtn" type="button">저장</button>
              <div class="saved-state" id="savedState">저장 전</div>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel bank" id="bankPanel">
        <div class="bank-head">
          <h2>Bank</h2>
          <button class="bank-close" id="bankCloseBtn" type="button" aria-label="Bank 닫기">×</button>
        </div>

        <div id="glossArea"></div>

        <ul class="bank-list" id="bank"></ul>
      </aside>
    </main>
  </div>

  <div class="mobile-bank-backdrop" id="mobileBankBackdrop"></div>


  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="salmon_toast.js?v=20260520-tray-submit" defer></script>
  <script src="Salmon.js?v=20260520-tray-submit" defer></script>
</body>
</html>
