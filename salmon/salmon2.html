<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>나뭇잎연어2</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a1017;
      color: #e7edf5;
      font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, Malgun Gothic, Helvetica, Arial, sans-serif;
    }

    .main-page {
      width: min(1120px, 96vw);
      height: min(840px, 92vh);
      border-radius: 14px;
      border: 1px solid rgba(143, 211, 255, 0.18);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18);
      background:
        radial-gradient(circle at 18% 14%, rgba(143, 211, 255, 0.18), transparent 30%),
        radial-gradient(circle at 84% 78%, rgba(167, 139, 250, 0.16), transparent 34%),
        linear-gradient(135deg, #0a1017, #0b1220 54%, #0a1017);
      position: relative;
      overflow: hidden;
    }

    .blank {
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(143, 211, 255, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8fd3ff;
      font-size: 28px;
      font-weight: 850;
      letter-spacing: 0;
    }

    @media (max-width: 767px) {
      .main-page {
        width: min(375px, 100vw);
        height: min(667px, 100dvh);
        border-radius: 2px;
      }

      .blank {
        inset: 20px 17px 21px;
        border-radius: 20px;
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="main-page">
    <div class="blank">Leaf Salmon2</div>
  </main>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="salmon_toast.js?v=20260520-leaf-salmon2" defer></script>
  <script src="Salmon2.js?v=20260520-leaf-salmon2" defer></script>
</body>
</html>
